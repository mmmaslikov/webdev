<style>

html[data-theme=dark]{

--border:#2a2242;--border2:#3a2f57;--ink:#efe9fb;--ink2:#b3a9cd;--ink3:#7f749c;
--ok:#4ade80;--okbg:#0d2c1b;--okrgb:74,222,128;--warn:#fbbf24;--warnbg:#31250b;--warnrgb:251,191,36;

--sh1:0 1px 2px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35);

}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}

a{color:var(--proj)}

*{scrollbar-color:rgba(var(--rgb),.55) var(--surface2);scrollbar-width:thin}
.aura{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}

.aura i:nth-child(1){width:54vw;height:54vw;left:-16vw;top:-20vw;background:radial-gradient(circle at 30% 30%,rgba(var(--rgb),.95),transparent 68%);animation:d1 27s ease-in-out infinite}
.aura i:nth-child(2){width:46vw;height:46vw;right:-14vw;top:4vh;background:radial-gradient(circle at 60% 40%,rgba(236,72,153,.4),transparent 70%);animation:d2 33s ease-in-out infinite}
.aura i:nth-child(3){width:42vw;height:42vw;left:28vw;bottom:-22vw;background:radial-gradient(circle at 50% 50%,rgba(var(--rgb),.5),transparent 72%);animation:d1 39s ease-in-out infinite reverse}

@keyframes d2{0%,100%{transform:translate3d(0,0,0) scale(1.05)}50%{transform:translate3d(-6vw,6vh,0) scale(.9)}}

.topbar{position:fixed;top:0;left:0;right:0;z-index:40;height:var(--top);background:var(--surface);border-bottom:1px solid var(--border);opacity:.97;backdrop-filter:blur(14px)}
.tb{max-width:1200px;margin:0 auto;height:100%;padding:0 16px;display:flex;align-items:center;gap:10px}

.hero{position:relative;border:1px solid var(--border);border-radius:var(--rx);padding:44px 32px;text-align:center;overflow:hidden;box-shadow:var(--sh2);background:radial-gradient(120% 120% at 8% 0%,rgba(var(--rgb),.16),transparent 55%),radial-gradient(100% 100% at 100% 100%,rgba(236,72,153,.14),transparent 60%),var(--surface)}

.sec{margin:26px 0}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh1);transition:.18s}

.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr}

.field{margin-bottom:12px}

}

  if(el>=x.to)ph[i].classList.add("done");else ph[i].classList.remove("done");}

  var btn=document.getElementById("tbtn");if(btn)btn.textContent="Старт";

 if(hit.hasAttribute("data-copy")){copyText(textFor(hit.getAttribute("data-copy")),hit);return;}
 if(hit.hasAttribute("data-sw")){
  var k=hit.getAttribute("data-sw"),L=state.lab;
  if(k==="theme")L.theme=L.theme==="dark"?"light":"dark";
  else L[k]=!L[k];
  save();refreshLab();
  if(k==="stringify"&&!L.stringify)toast("Без stringify данные портятся тихо — посмотри панель 1.");
  if(k==="guard"&&!L.guard)toast("Защита снята: любой сбой теперь роняет страницу.");
  return;
 }
 if(hit.hasAttribute("data-topic")){
  state.topic=hit.getAttribute("data-topic");save();
  var y=window.scrollY;renderView();window.scrollTo(0,y);
  toast("Тема: «"+T().name+"». Ключ, токены и промпты обновлены.");return;
 }
 if(hit.hasAttribute("data-steptoggle")){
  var sn=parseInt(hit.getAttribute("data-steptoggle"),10);
  state.steps[sn]=!state.steps[sn];save();
  var box=hit.closest(".step");
  if(box){if(state.steps[sn])box.classList.add("done");else box.classList.remove("done");}
  hit.setAttribute("aria-pressed",String(!!state.steps[sn]));updateChrome();return;
 }
 if(hit.hasAttribute("data-accept")){
  var sid=hit.getAttribute("data-accept");
  state.accept[sid]=!state.accept[sid];
  if(!acceptAll())state.checks[23]=false;
  save();
  if(state.accept[sid])hit.classList.add("on");else hit.classList.remove("on");
  hit.setAttribute("aria-checked",String(!!state.accept[sid]));
  rebuildList();refreshRing();updateChrome();
  var head=document.querySelector(".prow");
  if(head){var chips=head.querySelectorAll(".pcode");if(chips.length>=4)chips[3].textContent="ПРИЁМКА "+acceptDone()+" / 8";}
  if(acceptAll())toast("Все восемь шагов пройдены — пункт 23 открыт.");
  return;
 }
 if(hit.hasAttribute("data-check")){
  var cn=parseInt(hit.getAttribute("data-check"),10);
  if(cn===23&&!acceptAll()){toast("Пункт 23 закрыт: сначала пройди все восемь шагов сценария ("+acceptDone()+" из 8).");return;}
  state.checks[cn]=!state.checks[cn];save();
  if(state.checks[cn])hit.classList.add("on");else hit.classList.remove("on");
  hit.setAttribute("aria-checked",String(!!state.checks[cn]));
  refreshRing();updateChrome();return;
 }
 if(hit.hasAttribute("data-extra")){
  var eid=hit.getAttribute("data-extra");
  state.extras[eid]=!state.extras[eid];save();
  if(state.extras[eid])hit.classList.add("on");else hit.classList.remove("on");
  hit.setAttribute("aria-checked",String(!!state.extras[eid]));refreshRing();return;
 }
 if(hit.hasAttribute("data-filter")){
  state.filter=hit.getAttribute("data-filter");save();
  var fs=document.querySelectorAll("[data-filter]"),i;
  for(i=0;i<fs.length;i++){if(fs[i].getAttribute("data-filter")===state.filter)fs[i].classList.add("on");else fs[i].classList.remove("on");}
  rebuildList();return;
 }
 if(hit.hasAttribute("data-tab")){go(hit.getAttribute("data-tab"));return;}

 var a=hit.getAttribute("data-action");
 if(a==="start"){state.started=true;save();view.classList.remove("nostart");renderView();window.scrollTo({top:0,behavior:"smooth"});
  toast("Начни с вкладки «Спринт»: выбери тему и впиши логин GitHub.");}
 else if(a==="go-sprint")go("sprint");
 else if(a==="go-check")go("check");
 else if(a==="go-github")go("github");
 else if(a==="go-tpl")go("tpl");
 else if(a==="go-lab")go("lab");
 else if(a&&a.indexOf("go-p")===0){
  var pid=a.replace("go-","");state.tab="prompts";save();renderView();
  setTimeout(function(){var node=document.getElementById(pid);
   if(node){node.scrollIntoView({behavior:"smooth",block:"start"});node.style.boxShadow="0 0 0 3px rgba(var(--rgb),.35)";
    setTimeout(function(){node.style.boxShadow="";},1800);}},90);
 }
 else if(a==="lab-add"){state.lab.count=Math.min(6,state.lab.count+1);save();refreshLab();}
 else if(a==="lab-del"){state.lab.count=Math.max(0,state.lab.count-1);save();refreshLab();}
 else if(a==="lab-private"){state.lab.unavailable=true;state.lab.count=0;save();refreshLab();toast("Первый визит: хранилище пусто и недоступно.");}
 else if(a==="lab-theme"){state.lab.theme=state.lab.theme==="dark"?"light":"dark";save();refreshLab();}
 else if(a==="lab-reset"){state.lab={stringify:true,version:"v1",unavailable:false,broken:false,wrongShape:false,guard:true,theme:"light",duration:160,reduced:false,count:3};save();refreshLab();toast("Лаборатория сброшена.");}
 else if(a==="timer"){
  if(state.timer.running){timerTick();state.timer.running=false;state.timer.endsAt=null;stopTick();}
  else{if(state.timer.left<=0)state.timer.left=3000;state.timer.endsAt=Date.now()+state.timer.left*1000;state.timer.running=true;startTick();}
  var tb=document.getElementById("tbtn");if(tb)tb.textContent=state.timer.running?"Пауза":"Старт";
  var td=document.getElementById("tdial");if(td){if(state.timer.running)td.classList.add("run");else td.classList.remove("run");}
  save();
 }
 else if(a==="timer-reset"){
  state.timer={left:3000,running:false,endsAt:null};stopTick();save();
  var d2=document.getElementById("tdial");if(d2){d2.textContent=fmt(3000);d2.classList.remove("run");}
  var b2=document.getElementById("tbtn");if(b2)b2.textContent="Старт";
  var p2=document.getElementById("tphase");if(p2)p2.innerHTML="<b>"+esc(PHASES[0].t)+"</b>"+esc(PHASES[0].d);
  var ph2=document.querySelectorAll("[data-phase]"),q;
  for(q=0;q<ph2.length;q++){if(q===0)ph2[q].classList.add("on");else ph2[q].classList.remove("on");ph2[q].classList.remove("done");}
  toast("Таймер сброшен на 50 минут.");
 }
 else if(a==="verify"){
  var slot=document.getElementById("verdictSlot");
  if(slot){slot.innerHTML=verdictHTML();slot.scrollIntoView({behavior:"smooth",block:"center"});}
  if(passed()){confetti();toast("MVP достигнут. Сохрани отчёт в PDF и покажи ссылку педагогу.");}
  else toast("MVP ещё не закрыт: смотри список в вердикте.");
  updateChrome();
 }
 else if(a==="copy-report"){copyText(reportText(),hit,"Отчёт скопирован текстом — можно отправить педагогу.");}
 else if(a==="reset"){
  if(window.confirm("Сбросить отметки чек-листа, приёмки и шагов? Тема, логин и ссылка останутся.")){
   state.checks={};state.extras={};state.steps={};state.accept={};state.filter="all";
   save();renderView();toast("Отметки сброшены.");}
 }
 else if(a==="print"){
  if(!state.started)return;
  if(state.tab!=="check"){go("check");setTimeout(function(){window.print();},200);}
  else window.print();
 }
});

document.addEventListener("keydown",function(e){
 var el=e.target;if(!el||!el.hasAttribute)return;
 if(e.key===" "||e.key==="Enter"){
  if(el.hasAttribute("data-check")||el.hasAttribute("data-extra")||el.hasAttribute("data-accept")||el.hasAttribute("data-steptoggle")){e.preventDefault();el.click();}
 }
});

document.addEventListener("input",function(e){
 var el=e.target;if(!el||!el.getAttribute)return;
 var lk=el.getAttribute("data-lab");
 if(lk){
  state.lab[lk]=parseInt(el.value,10);save();
  var lbl=document.getElementById(lk==="duration"?"labDurVal":"labCountVal");
  if(lbl)lbl.textContent=el.value+(lk==="duration"?" мс":"");
  refreshLab();return;
 }
 var v=el.getAttribute("data-var");if(!v)return;
 state[v]=el.value;
 if(String(el.value).trim())el.classList.add("filled");else el.classList.remove("filled");
 save();
 if(v==="q"){
  var q=String(state.q||"").toLowerCase().trim(),blocks=document.querySelectorAll(".pblock"),i,j,pid,pr,hit;
  for(i=0;i<blocks.length;i++){pid=blocks[i].id;pr=null;
   for(j=0;j<PROMPTS.length;j++){if(PROMPTS[j].id===pid)pr=PROMPTS[j];}
   if(!pr)continue;
   hit=!q||(pr.n+" "+pr.t+" "+pr.s).toLowerCase().indexOf(q)!==-1;
   blocks[i].style.display=hit?"":"none";}
  return;
 }
 refreshDynamic();
});

document.addEventListener("change",function(e){
 var el=e.target;if(!el||!el.getAttribute)return;
 var lk=el.getAttribute("data-lab");
 if(lk==="version"){state.lab.version=el.value;save();refreshLab();}
});

document.getElementById("themeBtn").addEventListener("click",function(){
 state.dark=!state.dark;save();applyTheme();
 toast(state.dark?"Тёмная тема включена — изменились только токены.":"Светлая тема включена.");
});
document.getElementById("printBtn").addEventListener("click",function(){
 if(!state.started)return;
 if(state.tab!=="check"){go("check");setTimeout(function(){window.print();},200);}
 else window.print();
});

window.addEventListener("error",function(ev){
 var box=document.getElementById("view");
 if(box&&!box.innerHTML.trim()){box.className="nostart";
  box.innerHTML='<div class="errbox">Ошибка скрипта: '+esc(ev.message)+'\nСтрока: '+esc(ev.lineno)+':'+esc(ev.colno)+'</div>';}
});

function boot(){
 applyTheme();renderView();
 if(state.timer.running){
  if(state.timer.endsAt&&state.timer.endsAt>Date.now()){startTick();timerTick();}
  else{state.timer.running=false;state.timer.endsAt=null;save();}
 }
}
try{boot();}
catch(err){view.className="nostart";view.innerHTML='<div class="errbox">Не удалось запустить страницу.\n'+esc(err&&err.message?err.message:String(err))+'</div>';}
})();
</script>
</body>
</html>
