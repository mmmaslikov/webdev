<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Рабочий лист · Занятие 3 · Формы, таблицы, медиа</title>
<style>
  /* ---------- Переменные темы ---------- */
  :root{
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-2: #f4f4f5;
    --surface-3: #e4e4e7;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --text: #09090b;
    --text-2: #52525b;
    --text-3: #71717a;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --accent-hover: #1d4ed8;
    --success: #16a34a;
    --success-soft: #dcfce7;
    --warn: #f59e0b;
    --warn-soft: #fef3c7;
    --code-bg: #0f172a;
    --code-text: #e2e8f0;
    --shadow-sm: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
    --shadow-md: 0 4px 6px -1px rgba(15,23,42,.06), 0 2px 4px -2px rgba(15,23,42,.06);
    --radius-sm: 10px;
    --radius: 14px;
    --radius-lg: 18px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button, input, textarea{font-family:inherit;font-size:inherit;color:inherit}

  /* ---------- Шапка ---------- */
  .topbar{
    position:sticky; top:0; z-index:10;
    background:rgba(255,255,255,.85);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:960px; margin:0 auto;
    padding:14px 20px;
    display:flex; align-items:center; gap:14px;
  }
  .brand{display:flex; flex-direction:column; min-width:0; flex:1}
  .brand-title{
    font-size:14px; font-weight:600; letter-spacing:-0.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .brand-sub{
    font-size:12px; color:var(--text-3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .progress-wrap{display:flex; align-items:center; gap:10px; min-width:140px}
  .progress-bar{
    flex:1; height:6px; background:var(--surface-2);
    border-radius:999px; overflow:hidden; min-width:80px;
  }
  .progress-fill{
    height:100%; width:0%;
    background:var(--accent);
    border-radius:999px;
    transition:width .4s cubic-bezier(.22,.61,.36,1);
  }
  .progress-num{
    font-size:13px; font-weight:600; color:var(--text-2);
    font-variant-numeric:tabular-nums;
    min-width:38px; text-align:right;
  }

  main{max-width:960px; margin:0 auto; padding:28px 20px 120px}

  /* ---------- Экран «Старт» ---------- */
  .hero{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:40px 32px;
    box-shadow:var(--shadow-md);
    text-align:center;
  }
  .hero-badge{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 12px;
    background:var(--accent-soft);
    color:var(--accent);
    border-radius:999px;
    font-size:12px; font-weight:600;
    letter-spacing:.02em;
  }
  .hero h1{
    font-size:clamp(26px, 4vw, 36px);
    font-weight:700;
    letter-spacing:-0.02em;
    margin:18px 0 10px;
    line-height:1.15;
  }
  .hero p{
    color:var(--text-2);
    font-size:16px;
    max-width:560px;
    margin:0 auto 24px;
  }
  .hero-meta{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    margin-bottom:28px;
  }
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 12px;
    background:var(--surface-2);
    border-radius:999px;
    font-size:13px; color:var(--text-2);
  }
  .chip b{color:var(--text); font-weight:600}

  /* ---------- Кнопки ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    gap:8px;
    min-height:44px;
    padding:0 22px;
    border-radius:12px;
    border:1px solid transparent;
    font-size:15px; font-weight:600;
    cursor:pointer;
    transition:all .15s ease;
    user-select:none;
  }
  .btn:focus-visible{outline:3px solid var(--accent-soft); outline-offset:2px}
  .btn-primary{
    background:var(--accent); color:#fff;
    box-shadow:0 1px 2px rgba(37,99,235,.3), 0 4px 12px rgba(37,99,235,.15);
  }
  .btn-primary:hover{background:var(--accent-hover)}
  .btn-primary:active{transform:translateY(1px)}
  .btn-secondary{background:var(--surface); color:var(--text); border-color:var(--border-strong)}
  .btn-secondary:hover{background:var(--surface-2)}
  .btn-ghost{background:transparent; color:var(--text-2)}
  .btn-ghost:hover{background:var(--surface-2); color:var(--text)}
  .btn-lg{min-height:52px; padding:0 28px; font-size:16px; border-radius:14px}

  /* ---------- Разделы ---------- */
  .section{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:28px;
    margin-bottom:20px;
    box-shadow:var(--shadow-sm);
  }
  .section-head{
    display:flex; align-items:flex-start; gap:14px;
    margin-bottom:18px;
  }
  .section-num{
    flex-shrink:0;
    width:36px; height:36px;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:15px;
  }
  .section-num.theory{background:#0f172a}
  .section-num.practice{background:var(--accent)}
  .section-title-wrap{flex:1; min-width:0}
  .section-title{
    font-size:20px; font-weight:700; letter-spacing:-0.01em;
    margin:0 0 4px;
  }
  .section-sub{font-size:14px; color:var(--text-2); margin:0}
  .section-status{
    flex-shrink:0;
    padding:4px 10px;
    border-radius:999px;
    font-size:12px; font-weight:600;
    background:var(--surface-2);
    color:var(--text-3);
  }
  .section-status.done{background:var(--success-soft); color:var(--success)}

  .instruction{
    background:var(--surface-2);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:20px;
    font-size:14px;
    color:var(--text-2);
  }
  .instruction ol, .instruction ul{margin:0; padding-left:18px}
  .instruction li{margin-bottom:4px}
  .instruction li::marker{color:var(--accent); font-weight:600}

  /* ---------- Теория: термины ---------- */
  .terms-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    margin-bottom:24px;
  }
  @media (min-width:640px){
    .terms-grid{grid-template-columns:1fr 1fr}
  }
  .term{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .term:hover{border-color:var(--border-strong)}
  .term.learned{
    border-color:var(--accent);
    background:#f8fbff;
  }
  .term-head{
    display:flex; align-items:center; gap:10px;
    margin-bottom:6px;
  }
  .term-name{
    font-weight:700; font-size:15px;
    font-family:var(--mono);
    color:var(--accent);
  }
  .term-check{
    margin-left:auto;
    width:20px; height:20px;
    border-radius:6px;
    border:2px solid var(--border-strong);
    display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
    flex-shrink:0;
  }
  .term.learned .term-check{
    background:var(--success);
    border-color:var(--success);
  }
  .term-check svg{
    width:12px; height:12px;
    stroke:#fff; stroke-width:3; fill:none;
    opacity:0;
    transition:opacity .15s ease;
  }
  .term.learned .term-check svg{opacity:1}
  .term-def{
    font-size:14px;
    color:var(--text-2);
    line-height:1.5;
  }

  /* ---------- Теория: таблица тегов ---------- */
  .tags-table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
    margin-bottom:16px;
  }
  .tags-table th{
    text-align:left;
    padding:10px 12px;
    background:var(--surface-2);
    font-weight:600;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--text-3);
    border-bottom:1px solid var(--border);
  }
  .tags-table td{
    padding:12px;
    border-bottom:1px solid var(--border);
    vertical-align:top;
  }
  .tags-table tr:last-child td{border-bottom:none}
  .tags-table tr:hover td{background:var(--surface-2)}
  .tag-code{
    font-family:var(--mono);
    font-size:13px;
    color:var(--accent);
    font-weight:600;
    background:var(--accent-soft);
    padding:2px 8px;
    border-radius:6px;
    white-space:nowrap;
  }
  .tag-used{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    padding:2px 6px;
    border-radius:4px;
    background:var(--warn-soft);
    color:#92400e;
    margin-left:6px;
    letter-spacing:.03em;
  }

  /* ---------- Код ---------- */
  .code-block{
    background:var(--code-bg);
    color:var(--code-text);
    border-radius:var(--radius);
    padding:18px;
    font-family:var(--mono);
    font-size:13px;
    line-height:1.65;
    overflow-x:auto;
    white-space:pre;
    margin-bottom:16px;
    position:relative;
  }
  .code-block::before{
    content:"index.html";
    display:block;
    font-size:10px;
    letter-spacing:.1em;
    color:#64748b;
    margin-bottom:10px;
    font-weight:600;
  }
  .code-block .tk-tag{color:#7dd3fc}
  .code-block .tk-attr{color:#fde68a}
  .code-block .tk-com{color:#64748b; font-style:italic}
  .code-block .tk-txt{color:#e2e8f0}

  /* ---------- Эталон-тоггл ---------- */
  .ethalon-toggle{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding:20px;
    background:linear-gradient(180deg, #f8fbff 0%, #eff6ff 100%);
    border:1px dashed var(--accent);
    border-radius:var(--radius);
    text-align:center;
    margin-bottom:16px;
  }
  .ethalon-toggle-text{
    font-size:14px;
    color:var(--text-2);
    max-width:480px;
    line-height:1.5;
  }
  .ethalon-toggle-text b{color:var(--text)}
  .ethalon-content{
    overflow:hidden;
    max-height:0;
    opacity:0;
    transition:max-height .4s ease, opacity .3s ease, margin .3s ease;
    margin-top:0;
  }
  .ethalon-content.open{
    max-height:5000px;
    opacity:1;
    margin-top:16px;
  }

  /* ---------- Поля ввода ---------- */
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  .field-label{
    display:block;
    font-size:13px;
    color:var(--text-2);
    margin-bottom:6px;
    font-weight:600;
  }
  .field-hint{
    font-size:12px;
    color:var(--text-3);
    font-weight:400;
    margin-left:4px;
  }
  .field-input{
    width:100%;
    min-height:40px;
    padding:10px 14px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--surface);
    font-size:14px;
    transition:border-color .15s ease, background .15s ease;
  }
  .field-input::placeholder{color:var(--text-3)}
  .field-input:hover{border-color:var(--border-strong)}
  .field-input:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .field-input.filled{background:#f8fbff; border-color:var(--accent)}
  textarea.field-input{
    min-height:100px;
    resize:vertical;
    line-height:1.5;
    font-family:var(--font);
  }
  textarea.field-input.code{
    font-family:var(--mono);
    font-size:13px;
    line-height:1.6;
    min-height:220px;
    tab-size:2;
  }

  /* ---------- ТЗ ---------- */
  .tasks-list{
    display:grid;
    gap:14px;
    margin-bottom:20px;
  }
  .task-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .task-card.done{
    border-color:var(--success);
    background:#f8fdf9;
  }
  .task-card-head{
    display:flex; align-items:center; gap:10px;
    margin-bottom:10px;
  }
  .task-card-num{
    width:26px; height:26px;
    border-radius:8px;
    background:var(--surface-2);
    color:var(--text-2);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px;
    flex-shrink:0;
  }
  .task-card.done .task-card-num{background:var(--success); color:#fff}
  .task-card-title{
    font-weight:700; font-size:15px;
    flex:1;
  }
  .task-card-desc{
    font-size:14px;
    color:var(--text-2);
    margin:0 0 12px;
    line-height:1.5;
  }
  .task-card-desc code{
    font-family:var(--mono);
    font-size:13px;
    background:var(--surface-2);
    padding:1px 6px;
    border-radius:4px;
    color:var(--accent);
  }
  .task-card-note{
    display:flex; align-items:flex-start; gap:8px;
    padding:10px 12px;
    background:var(--warn-soft);
    border-radius:10px;
    font-size:13px;
    color:#78350f;
    margin-bottom:12px;
    line-height:1.5;
  }
  .task-card-note b{font-weight:700}

  /* ---------- Алгоритм ---------- */
  .algo{
    background:linear-gradient(180deg, #fffbeb 0%, #fef3c7 100%);
    border:1px solid #fde68a;
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:20px;
  }
  .algo-title{
    font-weight:700; font-size:15px;
    color:#78350f;
    margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .algo ol{margin:0; padding-left:20px; color:#78350f}
  .algo li{margin-bottom:6px; font-size:14px}
  .algo li::marker{font-weight:700}
  .algo-note{
    margin-top:12px;
    padding:10px 12px;
    background:rgba(255,255,255,.5);
    border-radius:8px;
    font-size:13px;
    color:#78350f;
    line-height:1.5;
  }
  .algo-note b{font-weight:700}
  .algo-note code{
    font-family:var(--mono);
    font-size:12px;
    background:rgba(255,255,255,.7);
    padding:1px 5px;
    border-radius:4px;
  }

  /* ---------- Промпт ---------- */
  .prompt-box{
    background:var(--code-bg);
    color:var(--code-text);
    border-radius:var(--radius);
    padding:18px;
    font-family:var(--mono);
    font-size:13px;
    line-height:1.6;
    white-space:pre-wrap;
    margin-bottom:16px;
    position:relative;
    word-break:break-word;
  }
  .prompt-box::before{
    content:"ПРОМПТ ДЛЯ ИИ";
    display:block;
    font-size:10px;
    letter-spacing:.1em;
    color:#64748b;
    margin-bottom:10px;
    font-weight:600;
  }
  .copy-btn{
    position:absolute; top:12px; right:12px;
    padding:6px 12px;
    background:rgba(255,255,255,.08);
    color:#cbd5e1;
    border:1px solid rgba(255,255,255,.1);
    border-radius:8px;
    font-size:12px; font-weight:500;
    cursor:pointer;
    min-height:32px;
    transition:all .15s ease;
  }
  .copy-btn:hover{background:rgba(255,255,255,.15); color:#fff}
  .copy-btn.copied{background:var(--success); color:#fff; border-color:var(--success)}

  .ai-links{
    display:flex; gap:10px; flex-wrap:wrap;
    margin-bottom:16px;
  }
  .ai-link{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 16px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text);
    text-decoration:none;
    font-size:14px; font-weight:500;
    transition:all .15s ease;
    min-height:44px;
  }
  .ai-link:hover{border-color:var(--accent); background:var(--accent-soft)}
  .ai-link-dot{
    width:8px; height:8px; border-radius:50%;
  }
  .ai-link-dot.deepseek{background:#4d6bfe}
  .ai-link-dot.alice{background:#fc3f1d}
  .ai-link-dot.qwen{background:#615ced}

  /* ---------- Чек-лист ---------- */
  .checklist{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:16px;
  }
  .checklist-title{
    font-size:12px; font-weight:600;
    color:var(--text-2);
    margin-bottom:12px;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .check-item{
    display:flex; align-items:flex-start; gap:12px;
    padding:10px 12px;
    border-radius:10px;
    cursor:pointer;
    transition:background .15s ease;
    user-select:none;
  }
  .check-item:hover{background:var(--surface-2)}
  .check-item.checked{background:var(--success-soft)}
  .check-box{
    flex-shrink:0;
    width:22px; height:22px;
    border:2px solid var(--border-strong);
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
    margin-top:1px;
  }
  .check-item.checked .check-box{
    background:var(--success);
    border-color:var(--success);
  }
  .check-box svg{
    width:14px; height:14px;
    stroke:#fff; stroke-width:3; fill:none;
    opacity:0;
    transition:opacity .15s ease;
  }
  .check-item.checked .check-box svg{opacity:1}
  .check-text{font-size:14px; color:var(--text); flex:1}

  /* ---------- Разделитель ---------- */
  .divider{
    height:1px;
    background:var(--border);
    margin:24px 0;
  }
  .sub-title{
    font-size:16px;
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0 0 12px;
    color:var(--text);
  }

  /* ---------- Футер с действиями ---------- */
  .actions{
    position:fixed;
    bottom:0; left:0; right:0;
    background:rgba(255,255,255,.9);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-top:1px solid var(--border);
    padding:12px 20px;
    z-index:10;
  }
  .actions-inner{
    max-width:960px; margin:0 auto;
    display:flex; gap:10px; justify-content:flex-end;
    flex-wrap:wrap;
  }

  /* ---------- Экран финала ---------- */
  .finish{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:40px 32px;
    box-shadow:var(--shadow-md);
    text-align:center;
  }
  .finish-icon{
    width:64px; height:64px;
    border-radius:50%;
    background:var(--success-soft);
    color:var(--success);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 20px;
  }
  .finish-icon svg{width:32px; height:32px; stroke:currentColor; fill:none; stroke-width:2.5}
  .finish h2{
    font-size:28px; font-weight:700; letter-spacing:-0.02em;
    margin:0 0 8px;
  }
  .finish p{color:var(--text-2); margin:0 0 24px}
  .stats{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:12px;
    margin-bottom:28px;
  }
  .stat{
    background:var(--surface-2);
    border-radius:var(--radius);
    padding:16px 12px;
  }
  .stat-val{
    font-size:24px; font-weight:700;
    color:var(--accent);
    letter-spacing:-0.02em;
  }
  .stat-lbl{
    font-size:12px; color:var(--text-3);
    margin-top:2px;
  }
  .finish-actions{
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
  }

  .hidden{display:none !important}

  /* ---------- Печать ---------- */
  @media print{
    @page{size:A4; margin:15mm}
    body{background:#fff}
    .topbar, .actions, .copy-btn, .btn-ghost{display:none !important}
    main{padding:0; max-width:100%}
    .section, .hero, .finish{
      box-shadow:none;
      break-inside:avoid;
      page-break-inside:avoid;
    }
    .field-input, textarea.field-input{
      border:1px solid #cbd5e1 !important;
      background:#fff !important;
    }
    .code-block, .prompt-box{

      state = deepMerge(state, parsed);
    }

function deepMerge(target, source){
  const out = Object.assign({}, target);
  for(const k in source){
    if(source[k] && typeof source[k] === "object" && !Array.isArray(source[k])){
      out[k] = deepMerge(target[k] || {}, source[k]);
    } else {
      out[k] = source[k];
    }
  }
  return out;
}

    total += 2;
    if(state.tasks[t.id].code.trim()) filled++;
    if(state.tasks[t.id].note.trim()) filled++;
  });

  total++;
  if(state.prompt.response.trim()) filled++;
  CHECKLIST.forEach((_,i) => {
    total++;
    if(state.prompt.checklist[i]) filled++;
  });
  total++;
  if(state.prompt.weak.trim()) filled++;

  return { filled, total, percent: total ? Math.round(filled/total*100) : 0 };
}

/* ---------- Обработчики ---------- */
function bindHandlers(){
  app.querySelectorAll("[data-action]").forEach(btn => {
    btn.addEventListener("click", handleAction);
  });

  app.querySelectorAll("[data-term]").forEach(el => {
    const handler = () => {
      const key = el.dataset.term;
      state.termsLearned[key] = !state.termsLearned[key];
      saveState();
      render();
    };
    el.addEventListener("click", handler);
    el.addEventListener("keydown", e => {
      if(e.key === " " || e.key === "Enter"){ e.preventDefault(); handler(); }
    });
  });

  app.querySelectorAll("[data-task-key]").forEach(input => {
    input.addEventListener("input", e => {
      const id = e.target.dataset.taskId;
      const key = e.target.dataset.taskKey;
      state.tasks[id][key] = e.target.value;
      updateFieldVisual(e.target);
      updateTaskCardVisual(id);
      updateProgress();
      saveState();
    });
  });

  app.querySelectorAll("[data-prompt-task]").forEach(radio => {
    radio.addEventListener("change", e => {
      state.prompt.selectedTask = e.target.value;
      const group = e.target.closest(".field");
      group.querySelectorAll(".radio").forEach(r => r.classList.remove("selected"));
      e.target.closest(".radio").classList.add("selected");
      saveState();
      render();
    });
  });

  app.querySelectorAll("[data-prompt-key]").forEach(input => {
    input.addEventListener("input", e => {
      state.prompt[e.target.dataset.promptKey] = e.target.value;
      updateFieldVisual(e.target);
      updateProgress();
      saveState();
    });
  });

  app.querySelectorAll("[data-check-idx]").forEach(item => {
    const handler = () => {
      const idx = parseInt(item.dataset.checkIdx, 10);
      state.prompt.checklist[idx] = !state.prompt.checklist[idx];
      item.classList.toggle("checked", state.prompt.checklist[idx]);
      item.setAttribute("aria-checked", String(state.prompt.checklist[idx]));
      updateProgress();
      saveState();
    };
    item.addEventListener("click", handler);
    item.addEventListener("keydown", e => {
      if(e.key === " " || e.key === "Enter"){ e.preventDefault(); handler(); }
    });
  });
}

function handleAction(e){
  const action = e.currentTarget.dataset.action;
  if(action === "start"){
    state.started = true;
    saveState();
    render();
    window.scrollTo({top:0, behavior:"smooth"});
  } else if(action === "reset"){
    if(confirm("Сбросить все заполненные поля? Это действие нельзя отменить.")){
      localStorage.removeItem(STORAGE_KEY);
      state = {
        started:false, finished:false, ethalonOpen:false,
        termsLearned:{},
        tasks:{ t1:{code:"",note:""}, t2:{code:"",note:""}, t3:{code:"",note:""} },
        prompt:{ selectedTask:"t1", customCode:"", response:"", checklist:[false,false,false,false,false,false,false], weak:"", fix:"" }
      };
      render();
      window.scrollTo({top:0, behavior:"smooth"});
    }
  } else if(action === "print"){
    window.print();
  } else if(action === "toggle-ethalon"){
    state.ethalonOpen = !state.ethalonOpen;
    saveState();
    render();
  } else if(action === "finish"){
    const p = countProgress();
    if(p.percent < 70){
      alert(`Заполни ещё немного — сейчас заполнено ${p.percent}%. Для завершения нужно 70%.`);
      return;
    }
    state.finished = true;
    saveState();
    render();
    window.scrollTo({top:0, behavior:"smooth"});
  } else if(action === "back"){
    state.finished = false;
    saveState();
    render();
  } else if(action === "copy-prompt"){
    copyToClipboard(buildPrompt(), e.currentTarget);
  }
}

/* ---------- Вспомогательные ---------- */
function buildPrompt(){
  let code = "";
  let context = "";
  if(state.prompt.selectedTask === "custom"){
    code = state.prompt.customCode || "(код пока не вставлен)";
    context = "страница, которую я написал";
  } else {
    code = state.tasks[state.prompt.selectedTask].code || "(код этого ТЗ пока не написан)";
    const task = TASKS.find(t => t.id === state.prompt.selectedTask);
    context = task ? task.context : "страница";
  }
  return PROMPT_TEMPLATE
    .replace("{CONTEXT}", context)
    .replace("{CODE}", code);
}

function updateFieldVisual(el){
  el.classList.toggle("filled", !!el.value.trim());
}
function updateTaskCardVisual(id){
  const card = document.querySelector(`[data-task="${id}"]`);
  if(!card) return;
  const done = state.tasks[id].code.trim() && state.tasks[id].note.trim();
  card.classList.toggle("done", done);
}
function updateProgress(){
  const p = countProgress();
  const fill = document.querySelector(".progress-fill");
  const num = document.querySelector(".progress-num");
  const bar = document.querySelector(".progress-bar");
  if(fill) fill.style.width = p.percent + "%";
  if(num) num.textContent = p.percent + "%";
  if(bar) bar.setAttribute("aria-valuenow", p.percent);

  const finishBtn = document.querySelector('[data-action="finish"]');
  if(finishBtn){
    if(p.percent >= 70){
      finishBtn.disabled = false;
      finishBtn.style.opacity = "";
      finishBtn.style.cursor = "";
    } else {
      finishBtn.disabled = true;
      finishBtn.style.opacity = ".5";
      finishBtn.style.cursor = "not-allowed";
    }
  }
}

async function copyToClipboard(text, btn){
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); }catch(_){}
    document.body.removeChild(ta);
  }
  const original = btn.textContent;
  btn.textContent = "✓ Скопировано";
  btn.classList.add("copied");
  setTimeout(() => {
    btn.textContent = original;
    btn.classList.remove("copied");
  }, 1600);
}

/* ИСПРАВЛЕННАЯ ФУНКЦИЯ ПОДСВЕТКИ (БЕЗОПАСНАЯ ДЛЯ DOM) */
function highlightHtml(code){
  const escaped = escapeHtml(code);
  return escaped
    // 1. Комментарии
    .replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="tk-com">$1</span>')
    // 2. Теги и атрибуты (подсвечиваем блок целиком, не разрывая кавычки внутри атрибутов)
    .replace(/(&lt;\/?[a-zA-Z0-9!]+)([\s\S]*?)(&gt;)/g, function(match, open, middle, close) {
      return '<span class="tk-tag">' + open + '</span><span class="tk-attr">' + middle + '</span><span class="tk-tag">' + close + '</span>';
    });
}

function escapeHtml(str){
  if(str == null) return "";
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

/* ---------- Инициализация ---------- */
function init(){
  loadState();
  render();
}
init();
