function T(){ for(var i=0;i<TOPICS.length;i++){ if(TOPICS[i].id===state.topic) return TOPICS[i]; } return TOPICS[0]; }
function esc(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function fill(s){ return String(s).replace(/\{ARR\}/g,T().arr).replace(/\{FN\}/g,T().fn); }
function slug(s){ return String(s||"").trim().toLowerCase().replace(/[^a-z0-9-]/g,""); }
function owner(){ return slug(state.owner); }
function repo(){ return slug(state.repo)||T().repo; }
function hasGH(){ return owner().length>0&&repo().length>0; }
function ghURL(p){ return hasGH()?"https://github.com/"+owner()+"/"+repo()+(p||""):""; }
function pagesURL(){ return owner()?"https://"+owner()+".github.io/"+repo()+"/":""; }
function dynLink(k){
  if(k==="repo") return ghURL("");
  if(k==="branches") return ghURL("/branches");
  if(k==="compare") return ghURL("/compare/main...feature/logic");
  if(k==="pages") return ghURL("/settings/pages");
  if(k==="actions") return ghURL("/actions");
  if(k==="pulls") return ghURL("/pulls");
  if(k==="site") return pagesURL();
  return "";
}

/* ---------- разбор ответа API ---------- */
function collectPaths(value){
  var out=[];
  function walk(v,segs,depth){
    if(out.length>=80) return;
    if(v===null||typeof v!=="object"){
      out.push({segs:segs.slice(),type:(v===null?"null":typeof v),sample:String(v).slice(0,70)});
      return;
    }
    if(depth>6) return;
    if(Array.isArray(v)){
      if(v.length===0){ out.push({segs:segs.slice(),type:"пустой массив",sample:"[]"}); return; }
      walk(v[0],segs.concat([0]),depth+1);
      return;
    }
    var keys=Object.keys(v),i;
    if(keys.length===0){ out.push({segs:segs.slice(),type:"пустой объект",sample:"{}"}); return; }
    for(i=0;i<keys.length&&out.length<80;i++) walk(v[keys[i]],segs.concat([keys[i]]),depth+1);
  }
  walk(value,[],0);
  return out;
}
function accessor(segs){
  var s="raw",i,k;
  for(i=0;i<segs.length;i++){
    k=segs[i];
    if(typeof k==="number") s+="["+k+"]";
    else if(/^[A-Za-z_$][A-Za-z0-9_$]*$/.test(k)) s+="."+k;
    else s+='["'+String(k).replace(/"/g,'\\"')+'"]';
  }
  return s;
}
function getVal(data,segs){
  var cur=data,i;
  for(i=0;i<segs.length;i++){
    if(cur===null||cur===undefined) return undefined;
    cur=cur[segs[i]];
  }
  return cur;
}
function parseApi(){
  var txt=String(state.api.paste||"").trim();
  if(!txt){ state.api.error="Поле пустое. Открой ответ по ссылке выше, скопируй его целиком и вставь сюда."; state.api.parsed=false; state.api.paths=[]; return; }
  var data;
  try{ data=JSON.parse(txt); }
  catch(e){ state.api.error="Это не JSON: "+e.message+". Скопируй ответ целиком, без лишних слов до и после."; state.api.parsed=false; state.api.paths=[]; return; }
  var paths=collectPaths(data);
  if(!paths.length){ state.api.error="Ответ разобран, но полей не найдено. Проверь, что скопировал весь ответ."; state.api.parsed=false; state.api.paths=[]; return; }
  state.api.paths=paths;
  state.api.parsed=true;
  state.api.error="";
}
function mapReady(){
  var t=T(),i,idx;
  if(!state.api.parsed) return false;
  for(i=0;i<t.targets.length;i++){
    idx=state.api.map[t.targets[i].k];
    if(idx===undefined||idx===null||idx==="") return false;
    if(!state.api.paths[Number(idx)]) return false;
  }
  return true;
}
function buildNormalize(){
  if(!mapReady()) return "";
  var t=T(),data;
  try{ data=JSON.parse(state.api.paste); }catch(e){ return ""; }
  var lines=["/* Нормализация: чужие имена полей живут только здесь */","function normalize(raw) {","  return {"];
  var i,p,v,acc,expr;
  for(i=0;i<t.targets.length;i++){
    p=state.api.paths[Number(state.api.map[t.targets[i].k])];
    acc=accessor(p.segs);
    v=getVal(data,p.segs);
    expr=acc;
    if(typeof v==="number") expr="Number("+acc+")";
    else if(typeof v==="string") expr="String("+acc+").trim()";
    lines.push("    "+t.targets[i].k+": "+expr+(i<t.targets.length-1?",":""));
  }
  lines.push("  };");
  lines.push("}");
  lines.push("");
  lines.push("/* Дальше весь код работает только со своими именами:");
  var names=[];
  for(i=0;i<t.targets.length;i++) names.push(t.targets[i].k);
  lines.push("   "+names.join(", ")+". Чужих путей в отрисовке быть не должно. */");
  return lines.join("\n");
}
function buildFallback(){
  if(!mapReady()) return "";
  var t=T(),data;
  try{ data=JSON.parse(state.api.paste); }catch(e){ return ""; }
  var lines=["/* Запасные данные той же формы, что возвращает normalize.",
             "   Значения ниже взяты из настоящего ответа — замени их на выдуманные,",
             "   если не хочешь класть чужой текст в репозиторий. */",
             "const FALLBACK = {"];
  var i,p,v,lit;
  for(i=0;i<t.targets.length;i++){
    p=state.api.paths[Number(state.api.map[t.targets[i].k])];
    v=getVal(data,p.segs);
    if(typeof v==="string") lit=JSON.stringify(v.slice(0,90));
    else if(typeof v==="number") lit=String(v);
    else if(typeof v==="boolean") lit=String(v);
    else lit='""';
    lines.push("  "+t.targets[i].k+": "+lit+(i<t.targets.length-1?",":""));
  }
  lines.push("};");
  lines.push("");
  lines.push('/* В catch: показать эти данные и честную пометку */');
  lines.push('/* statusBox.textContent = "Сервис недоступен — данные из сохранённой копии"; */');
  return lines.join("\n");
}

var io=null;
function observe(){
  if(io){ io.disconnect(); io=null; }
  var els=view.querySelectorAll("[data-reveal]"),i;
  if(!("IntersectionObserver" in window)){ for(i=0;i<els.length;i++) els[i].classList.add("in"); return; }
  io=new IntersectionObserver(function(en){
    for(var k=0;k<en.length;k++){ if(en[k].isIntersecting){ en[k].target.classList.add("in"); io.unobserve(en[k].target); } }
  },{rootMargin:"0px 0px -6% 0px",threshold:0.05});
  for(i=0;i<els.length;i++){ els[i].style.transitionDelay=Math.min(i,6)*40+"ms"; io.observe(els[i]); }
}
function updateRead(){
  var b=document.getElementById("readbar");
  if(!b) return;

}

var tick=null;
function stopTick(){ if(tick){ clearInterval(tick); tick=null; } }
function startTick(){ stopTick(); tick=setInterval(timerTick,1000); }
function timerTick(){
  if(!state.timer.running) return;
  var left=Math.max(0,Math.round((state.timer.endsAt-Date.now())/1000));
  state.timer.left=left;
  var d=document.getElementById("tdial"); if(d) d.textContent=fmt(left);
  var cp=curPhase(),p=document.getElementById("tphase");
  if(p) p.innerHTML="<b>"+esc(cp.t)+"</b>"+esc(cp.d);
  var el=3000-left,ph=document.querySelectorAll("[data-phase]"),i,x;
  for(i=0;i<ph.length;i++){
    x=PHASES[i];
    if(el>=x.from&&el<x.to) ph[i].classList.add("on"); else ph[i].classList.remove("on");
    if(el>=x.to) ph[i].classList.add("done"); else ph[i].classList.remove("done");
  }
  if(left<=0){
    state.timer.running=false; state.timer.endsAt=null; stopTick();
    var btn=document.getElementById("tbtn"); if(btn) btn.textContent="Старт";
    if(d) d.classList.remove("run");
    toast("Время спринта вышло. Проверь базовый блок и открой ссылку с телефона.");
  }
  save();
}

function fallbackCopy(text,done){
  var ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ toast("Скопируй текст вручную из блока."); }
  document.body.removeChild(ta);
}
function copyText(text,btn,msg){
  if(!text){ toast("Сначала собери код: разбери ответ и сопоставь поля."); return; }
  var done=function(){
    if(btn){ var o=btn.textContent; btn.textContent="✓ Скопировано"; btn.classList.add("done");
      setTimeout(function(){ btn.textContent=o; btn.classList.remove("done"); },1600); }
    toast(msg||"Скопировано. Вставь в Qwen или в GitHub.");
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done,function(){ fallbackCopy(text,done); }); }
  else fallbackCopy(text,done);
}
function reportText(){
  var t=T(),L=[],i;
  L.push("Занятие 21 · Спринт 2: данные и API");
  L.push("Тема: "+t.id+" «"+t.name+"» — "+t.kind);
  L.push("Массив проекта: "+t.arr+" · перерисовка: "+t.fn+"()");

  L.push("Ссылка: "+(state.link||"не указана"));

  L.push("Вердикт: "+(passed()?"спринт закрыт":"спринт не закрыт"));
  L.push("");
  for(i=0;i<CHECKS.length;i++){
    L.push((state.checks[CHECKS[i].n]?"[x] ":"[ ] ")+CHECKS[i].n+". "+fill(CHECKS[i].t)+(CHECKS[i].base?" (базовый)":"")+(CHECKS[i].main?" (главный)":""));
  }
  L.push("");
  L.push("Дополнительно: "+extrasDone()+" из 6");
  for(i=0;i<EXTRAS.length;i++) L.push((state.extras[EXTRAS[i].id]?"[x] ":"[ ] ")+EXTRAS[i].t);
  return L.join("\n");
}
function confetti(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if(!Element.prototype.animate) return;
  var cols=["#0e7490","#0891b2","#84cc16","#f59e0b","#ec4899","#4f46e5"],i,d,dx,dy,rot,an;
  for(i=0;i<32;i++){
    d=document.createElement("div"); d.className="conf";
    d.style.background=cols[i%cols.length];
    d.style.left=(50+(Math.random()*40-20))+"vw"; d.style.top="46vh";
    document.body.appendChild(d);
    dx=(Math.random()*2-1)*320; dy=-(180+Math.random()*260); rot=Math.random()*720-360;
    an=d.animate([
      {transform:"translate(0,0) rotate(0deg)",opacity:1},
      {transform:"translate("+dx+"px,"+dy+"px) rotate("+rot+"deg)",opacity:1,offset:.55},
      {transform:"translate("+(dx*1.3)+"px,"+(dy+520)+"px) rotate("+(rot*1.6)+"deg)",opacity:0}
    ],{duration:1500+Math.random()*700,easing:"cubic-bezier(.2,.6,.4,1)"});
    an.onfinish=(function(n){ return function(){ if(n.parentNode) n.parentNode.removeChild(n); }; })(d);
  }
}

document.addEventListener("click",function(e){

  if(!hit) return;

  if(hit.hasAttribute("data-copy")){ copyText(textFor(hit.getAttribute("data-copy")),hit); return; }
  if(hit.hasAttribute("data-topic")){
    state.topic=hit.getAttribute("data-topic");
    state.api.map={};
    save();

  }
  if(hit.hasAttribute("data-steptoggle")){
    var sn=parseInt(hit.getAttribute("data-steptoggle"),10);
    state.steps[sn]=!state.steps[sn]; save();
    var box=hit.closest(".step");
    if(box){ if(state.steps[sn]) box.classList.add("done"); else box.classList.remove("done"); }
    hit.setAttribute("aria-pressed",String(!!state.steps[sn]));
    updateChrome(); return;
  }
  if(hit.hasAttribute("data-check")){
    var cn=parseInt(hit.getAttribute("data-check"),10);
    state.checks[cn]=!state.checks[cn]; save();
    if(state.checks[cn]) hit.classList.add("on"); else hit.classList.remove("on");
    hit.setAttribute("aria-checked",String(!!state.checks[cn]));
    refreshRing(); updateChrome(); return;
  }
  if(hit.hasAttribute("data-extra")){
    var eid=hit.getAttribute("data-extra");
    state.extras[eid]=!state.extras[eid]; save();
    if(state.extras[eid]) hit.classList.add("on"); else hit.classList.remove("on");
    hit.setAttribute("aria-checked",String(!!state.extras[eid]));
    refreshRing(); return;
  }
  if(hit.hasAttribute("data-filter")){
    state.filter=hit.getAttribute("data-filter"); save();
    var fs=document.querySelectorAll("[data-filter]"),i;
    for(i=0;i<fs.length;i++){ if(fs[i].getAttribute("data-filter")===state.filter) fs[i].classList.add("on"); else fs[i].classList.remove("on"); }
    rebuildList(); return;
  }
  if(hit.hasAttribute("data-tab")){ go(hit.getAttribute("data-tab")); return; }

  var a=hit.getAttribute("data-action");
  if(a==="start"){
    state.started=true; save(); view.classList.remove("nostart"); renderView();
    window.scrollTo({top:0,behavior:"smooth"});
    toast("Начни с вкладки «Спринт»: выбери тему и впиши логин GitHub.");
  }
  else if(a==="go-sprint") go("sprint");
  else if(a==="go-check") go("check");
  else if(a==="go-github") go("github");
  else if(a==="go-tpl") go("tpl");
  else if(a==="go-api") go("api");
  else if(a&&a.indexOf("go-p")===0){
    var pid=a.replace("go-","");
    state.tab="prompts"; save(); renderView();
    setTimeout(function(){
      var node=document.getElementById(pid);
      if(node){ node.scrollIntoView({behavior:"smooth",block:"start"});
        node.style.boxShadow="0 0 0 3px rgba(var(--rgb),.35)";
        setTimeout(function(){ node.style.boxShadow=""; },1800); }
    },90);
  }
  else if(a==="api-parse"){ parseApi(); save(); refreshApiGen(); toast(state.api.parsed?"Ответ разобран. Сопоставь поля со своими именами.":"Не разобралось: смотри сообщение на вкладке."); }
  else if(a==="api-clear"){ state.api={paste:"",paths:[],map:{},parsed:false,error:""}; save(); refreshApiGen(); toast("Поле разбора очищено."); }
  else if(a==="timer"){
    if(state.timer.running){ timerTick(); state.timer.running=false; state.timer.endsAt=null; stopTick(); }
    else { if(state.timer.left<=0) state.timer.left=3000; state.timer.endsAt=Date.now()+state.timer.left*1000; state.timer.running=true; startTick(); }
    var tb=document.getElementById("tbtn"); if(tb) tb.textContent=state.timer.running?"Пауза":"Старт";
    var td=document.getElementById("tdial"); if(td){ if(state.timer.running) td.classList.add("run"); else td.classList.remove("run"); }
    save();
  }
  else if(a==="timer-reset"){
    state.timer={left:3000,running:false,endsAt:null}; stopTick(); save();
    var d2=document.getElementById("tdial"); if(d2){ d2.textContent=fmt(3000); d2.classList.remove("run"); }
    var b2=document.getElementById("tbtn"); if(b2) b2.textContent="Старт";
    var p2=document.getElementById("tphase"); if(p2) p2.innerHTML="<b>"+esc(PHASES[0].t)+"</b>"+esc(PHASES[0].d);
    var ph2=document.querySelectorAll("[data-phase]"),q;
    for(q=0;q<ph2.length;q++){ if(q===0) ph2[q].classList.add("on"); else ph2[q].classList.remove("on"); ph2[q].classList.remove("done"); }
    toast("Таймер сброшен на 50 минут.");
  }
  else if(a==="verify"){
    var slot=document.getElementById("verdictSlot");
    if(slot){ slot.innerHTML=verdictHTML(); slot.scrollIntoView({behavior:"smooth",block:"center"}); }
    if(passed()){ confetti(); toast("Спринт 2 закрыт. Сохрани отчёт в PDF и покажи массив в консоли."); }
    else toast("Пока не закрыт: смотри список в вердикте.");
    updateChrome();
  }
  else if(a==="copy-report"){ copyText(reportText(),hit,"Отчёт скопирован текстом — можно отправить педагогу."); }
  else if(a==="reset"){
    if(window.confirm("Сбросить все отметки чек-листа и шагов? Тема, логин, ссылка и разбор ответа останутся.")){
      state.checks={}; state.extras={}; state.steps={}; state.filter="all";
      save(); renderView(); toast("Отметки сброшены.");
    }
  }
  else if(a==="print"){
    if(!state.started) return;
    if(state.tab!=="check"){ go("check"); setTimeout(function(){ window.print(); },200); }
    else window.print();
  }
});

document.addEventListener("input",function(e){
  var el=e.target;
  if(!el||!el.getAttribute) return;
  var v=el.getAttribute("data-var");
  if(!v) return;
  if(v==="apiPaste"){
    state.api.paste=el.value;
    if(String(el.value).trim()) el.classList.add("filled"); else el.classList.remove("filled");
    save(); return;
  }
  state[v]=el.value;
  if(String(el.value).trim()) el.classList.add("filled"); else el.classList.remove("filled");
  save();
  if(v==="q"){
    var q=String(state.q||"").toLowerCase().trim(),blocks=document.querySelectorAll(".pblock"),i,j,pid,pr,hit;
    for(i=0;i<blocks.length;i++){
      pid=blocks[i].id; pr=null;
      for(j=0;j<PROMPTS.length;j++){ if(PROMPTS[j].id===pid) pr=PROMPTS[j]; }
      if(!pr) continue;
      hit=!q||(pr.n+" "+pr.t+" "+pr.s).toLowerCase().indexOf(q)!==-1;
      blocks[i].style.display=hit?"":"none";
    }
    return;
  }
  refreshDynamic();
});

document.addEventListener("change",function(e){
  var el=e.target;
  if(!el||!el.getAttribute) return;
  var k=el.getAttribute("data-apimap");
  if(k===null) return;
  state.api.map[k]=el.value;
  save();
  refreshApiGen();
  if(mapReady()) toast("Нормализация и фолбэк собраны — копируй в проект.");
});

document.getElementById("themeBtn").addEventListener("click",function(){
  state.dark=!state.dark; save(); applyTheme();
  toast(state.dark?"Тёмная тема включена — изменились только токены.":"Светлая тема включена.");
});
document.getElementById("printBtn").addEventListener("click",function(){
  if(!state.started) return;
  if(state.tab!=="check"){ go("check"); setTimeout(function(){ window.print(); },200); }
  else window.print();
});

window.addEventListener("error",function(ev){
  var box=document.getElementById("view");
  if(box&&!box.innerHTML.trim()){
    box.className="nostart";
    box.innerHTML='<div class="errbox">Ошибка скрипта: '+esc(ev.message)+'\nСтрока: '+esc(ev.lineno)+':'+esc(ev.colno)+'</div>';
  }
});

function boot(){
  applyTheme();
  renderView();
  if(state.timer.running){
    if(state.timer.endsAt&&state.timer.endsAt>Date.now()){ startTick(); timerTick(); }
    else { state.timer.running=false; state.timer.endsAt=null; save(); }
  }
}
try{ boot(); }
catch(err){
  view.className="nostart";
  view.innerHTML='<div class="errbox">Не удалось запустить страницу.\n'+esc(err&&err.message?err.message:String(err))+'</div>';
}
})();
</script>
</body>
</html>
