<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Рабочий лист · Занятие 7 · Анимации и UI-кит</title>
<style>
  :root{
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-2: #f4f4f5;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --text: #09090b;
    --text-2: #52525b;
    --text-3: #71717a;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --accent-hover: #1d4ed8;
    --success: #16a34a;
    --success-soft: #dcfce7;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --warn: #f59e0b;
    --warn-soft: #fef3c7;
    --code-bg: #0f172a;
    --code-text: #e2e8f0;
    --shadow-sm: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
    --shadow-md: 0 4px 6px -1px rgba(15,23,42,.06), 0 2px 4px -2px rgba(15,23,42,.06);
    --radius: 14px;
    --radius-lg: 18px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button, input, textarea{font-family:inherit;font-size:inherit;color:inherit}

  .topbar{
    position:sticky; top:0; z-index:10;
    background:rgba(255,255,255,.85);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{max-width:960px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:14px}
  .brand{display:flex; flex-direction:column; min-width:0; flex:1}
  .brand-title{font-size:14px; font-weight:600; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .brand-sub{font-size:12px; color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .progress-wrap{display:flex; align-items:center; gap:10px; min-width:140px}
  .progress-bar{flex:1; height:6px; background:var(--surface-2); border-radius:999px; overflow:hidden; min-width:80px}
  .progress-fill{height:100%; width:0%; background:var(--accent); border-radius:999px; transition:width .4s cubic-bezier(.22,.61,.36,1)}
  .progress-num{font-size:13px; font-weight:600; color:var(--text-2); font-variant-numeric:tabular-nums; min-width:38px; text-align:right}

  main{max-width:960px; margin:0 auto; padding:28px 20px 120px}

  .hero{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:40px 32px; box-shadow:var(--shadow-md); text-align:center}
  .hero-badge{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:var(--accent-soft); color:var(--accent); border-radius:999px; font-size:12px; font-weight:600; letter-spacing:.02em}
  .hero h1{font-size:clamp(26px, 4vw, 36px); font-weight:700; letter-spacing:-0.02em; margin:18px 0 10px; line-height:1.15}
  .hero p{color:var(--text-2); font-size:16px; max-width:560px; margin:0 auto 24px}
  .hero-meta{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:28px}
  .chip{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:var(--surface-2); border-radius:999px; font-size:13px; color:var(--text-2)}
  .chip b{color:var(--text); font-weight:600}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 22px; border-radius:12px; border:1px solid transparent; font-size:15px; font-weight:600; cursor:pointer; transition:all .15s ease; user-select:none}
  .btn:focus-visible{outline:3px solid var(--accent-soft); outline-offset:2px}
  .btn-primary{background:var(--accent); color:#fff; box-shadow:0 1px 2px rgba(37,99,235,.3), 0 4px 12px rgba(37,99,235,.15)}
  .btn-primary:hover{background:var(--accent-hover)}
  .btn-secondary{background:var(--surface); color:var(--text); border-color:var(--border-strong)}
  .btn-secondary:hover{background:var(--surface-2)}
  .btn-ghost{background:transparent; color:var(--text-2)}
  .btn-ghost:hover{background:var(--surface-2); color:var(--text)}
  .btn-lg{min-height:52px; padding:0 28px; font-size:16px; border-radius:14px}

  .section{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:28px; margin-bottom:20px; box-shadow:var(--shadow-sm)}
  .section-head{display:flex; align-items:flex-start; gap:14px; margin-bottom:18px}
  .section-num{flex-shrink:0; width:36px; height:36px; border-radius:10px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px}
  .section-num.theory{background:#0f172a}
  .section-num.practice{background:var(--accent)}
  .section-title-wrap{flex:1; min-width:0}
  .section-title{font-size:20px; font-weight:700; letter-spacing:-0.01em; margin:0 0 4px}
  .section-sub{font-size:14px; color:var(--text-2); margin:0}
  .section-status{flex-shrink:0; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600; background:var(--surface-2); color:var(--text-3)}
  .section-status.done{background:var(--success-soft); color:var(--success)}

  .instruction{background:var(--surface-2); border-radius:var(--radius); padding:14px 16px; margin-bottom:20px; font-size:14px; color:var(--text-2)}
  .instruction ol, .instruction ul{margin:0; padding-left:18px}
  .instruction li{margin-bottom:4px}
  .instruction li::marker{color:var(--accent); font-weight:600}

  .terms-grid{display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:24px}
  @media (min-width:640px){.terms-grid{grid-template-columns:1fr 1fr}}
  .term{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; cursor:pointer; transition:all .15s ease}
  .term:hover{border-color:var(--border-strong)}
  .term.learned{border-color:var(--accent); background:#f8fbff}
  .term-head{display:flex; align-items:center; gap:10px; margin-bottom:6px}
  .term-name{font-weight:700; font-size:15px; font-family:var(--mono); color:var(--accent)}
  .term-check{margin-left:auto; width:20px; height:20px; border-radius:6px; border:2px solid var(--border-strong); display:flex; align-items:center; justify-content:center; transition:all .15s ease; flex-shrink:0}
  .term.learned .term-check{background:var(--success); border-color:var(--success)}
  .term-check svg{width:12px; height:12px; stroke:#fff; stroke-width:3; fill:none; opacity:0; transition:opacity .15s ease}
  .term.learned .term-check svg{opacity:1}
  .term-def{font-size:14px; color:var(--text-2); line-height:1.5}

  .tags-table{width:100%; border-collapse:collapse; font-size:14px; margin-bottom:16px}
  .tags-table th{text-align:left; padding:10px 12px; background:var(--surface-2); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-3); border-bottom:1px solid var(--border)}
  .tags-table td{padding:12px; border-bottom:1px solid var(--border); vertical-align:top}
  .tags-table tr:last-child td{border-bottom:none}
  .tags-table tr:hover td{background:var(--surface-2)}
  .tag-code{font-family:var(--mono); font-size:13px; color:var(--accent); font-weight:600; background:var(--accent-soft); padding:2px 8px; border-radius:6px; white-space:nowrap}
  .tag-used{display:inline-block; font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; background:var(--warn-soft); color:#92400e; margin-left:6px; letter-spacing:.03em}

  .code-block{background:var(--code-bg); color:var(--code-text); border-radius:var(--radius); padding:18px; font-family:var(--mono); font-size:12.5px; line-height:1.6; overflow-x:auto; white-space:pre; margin-bottom:16px; position:relative}
  .code-block::before{content:"ui-kit.html"; display:block; font-size:10px; letter-spacing:.1em; color:#64748b; margin-bottom:10px; font-weight:600}

  .ethalon-toggle{display:flex; flex-direction:column; align-items:center; gap:10px; padding:20px; background:linear-gradient(180deg, #f8fbff 0%, #eff6ff 100%); border:1px dashed var(--accent); border-radius:var(--radius); text-align:center; margin-bottom:16px}
  .ethalon-toggle-text{font-size:14px; color:var(--text-2); max-width:520px; line-height:1.5}
  .ethalon-toggle-text b{color:var(--text)}
  .ethalon-content{overflow:hidden; max-height:0; opacity:0; transition:max-height .4s ease, opacity .3s ease, margin .3s ease; margin-top:0}
  .ethalon-content.open{max-height:20000px; opacity:1; margin-top:16px}

  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  .field-label{display:block; font-size:13px; color:var(--text-2); margin-bottom:6px; font-weight:600}
  .field-hint{font-size:12px; color:var(--text-3); font-weight:400; margin-left:4px}
  .field-input{width:100%; min-height:40px; padding:10px 14px; border:1px solid var(--border); border-radius:10px; background:var(--surface); font-size:14px; transition:border-color .15s ease, background .15s ease}
  .field-input::placeholder{color:var(--text-3)}
  .field-input:hover{border-color:var(--border-strong)}
  .field-input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .field-input.filled{background:#f8fbff; border-color:var(--accent)}
  textarea.field-input{min-height:100px; resize:vertical; line-height:1.5; font-family:var(--font)}
  textarea.field-input.code{font-family:var(--mono); font-size:13px; line-height:1.6; min-height:140px; tab-size:2}

  .algo{background:linear-gradient(180deg, #fffbeb 0%, #fef3c7 100%); border:1px solid #fde68a; border-radius:var(--radius); padding:18px; margin-bottom:20px}
  .algo-title{font-weight:700; font-size:15px; color:#78350f; margin-bottom:10px; display:flex; align-items:center; gap:8px}
  .algo ol{margin:0; padding-left:20px; color:#78350f}
  .algo li{margin-bottom:6px; font-size:14px}
  .algo li::marker{font-weight:700}
  .algo-note{margin-top:12px; padding:10px 12px; background:rgba(255,255,255,.5); border-radius:8px; font-size:13px; color:#78350f; line-height:1.5}
  .algo-note b{font-weight:700}
  .algo-note code{font-family:var(--mono); font-size:12px; background:rgba(255,255,255,.7); padding:1px 5px; border-radius:4px}

  /* ---------- Тест ---------- */
  .quiz-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px}
  .quiz-q{font-weight:600; font-size:14px; margin-bottom:10px; line-height:1.5}
  .quiz-q code{font-family:var(--mono); font-size:13px; background:var(--surface-2); padding:1px 6px; border-radius:4px; color:var(--accent)}
  .quiz-options{display:grid; gap:8px}
  .quiz-opt{min-height:44px; text-align:left; padding:10px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); cursor:pointer; font-size:14px; transition:all .15s ease; line-height:1.4}
  .quiz-opt:hover:not(:disabled){border-color:var(--border-strong); background:var(--surface-2)}
  .quiz-opt:focus-visible{outline:3px solid var(--accent-soft); outline-offset:2px}
  .quiz-opt:disabled{cursor:default}
  .quiz-opt.correct{background:var(--success-soft); border-color:var(--success); color:#14532d}
  .quiz-opt.wrong{background:var(--danger-soft); border-color:var(--danger); color:#7f1d1d}
  .quiz-feedback{margin-top:10px; font-size:13px; border-radius:10px; padding:10px 12px; line-height:1.5}
  .quiz-feedback.good{background:var(--success-soft); color:#14532d}
  .quiz-feedback.bad{background:var(--danger-soft); color:#7f1d1d}
  .quiz-score{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:var(--surface-2); font-size:13px; font-weight:600; color:var(--text-2); margin-bottom:14px}

  /* ---------- SVG-иконки ---------- */
  .icon-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:14px}
  .icon-head{display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap}
  .icon-title{font-weight:700; font-size:15px; flex:1; min-width:140px}
  .icon-status{padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; background:var(--surface-2); color:var(--text-3); letter-spacing:.03em}
  .icon-status.mid{background:var(--warn-soft); color:#92400e}
  .icon-status.good{background:var(--success-soft); color:var(--success)}
  .icon-preview-row{display:flex; gap:18px; align-items:flex-end; flex-wrap:wrap; padding:14px; background:var(--surface-2); border-radius:10px; margin:10px 0}
  .icon-preview-box{display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--text)}
  .icon-preview-box span{font-size:11px; color:var(--text-3)}
  .icon-preview-box.dark{background:#0f172a; color:#e2e8f0; border-radius:8px; padding:8px 10px; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .icon-preview-box.dark span{color:#94a3b8}
  .icon-preview-empty{font-size:13px; color:var(--text-3); line-height:1.5}
  .icon-checks{list-style:none; margin:0; padding:0; display:grid; gap:6px}
  .icon-checks li{display:flex; gap:8px; align-items:flex-start; font-size:13px; color:var(--text-2); line-height:1.45}
  .icon-checks li.ok{color:#14532d}
  .icon-checks li.bad{color:#7f1d1d}
  .ic-mark{flex-shrink:0; width:18px; height:18px; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; margin-top:1px}
  .icon-checks li.ok .ic-mark{background:var(--success-soft); color:var(--success)}
  .icon-checks li.bad .ic-mark{background:var(--danger-soft); color:var(--danger)}
  .icon-checks li.pending .ic-mark{background:var(--surface-2); color:var(--text-3)}

  .prompt-box{background:var(--code-bg); color:var(--code-text); border-radius:var(--radius); padding:18px; font-family:var(--mono); font-size:13px; line-height:1.6; white-space:pre-wrap; margin-bottom:16px; position:relative; word-break:break-word}
  .prompt-box::before{content:"ПРОМПТ ДЛЯ ИИ"; display:block; font-size:10px; letter-spacing:.1em; color:#64748b; margin-bottom:10px; font-weight:600}
  .copy-btn{position:absolute; top:12px; right:12px; padding:6px 12px; background:rgba(255,255,255,.08); color:#cbd5e1; border:1px solid rgba(255,255,255,.1); border-radius:8px; font-size:12px; font-weight:500; cursor:pointer; min-height:32px; transition:all .15s ease}
  .copy-btn:hover{background:rgba(255,255,255,.15); color:#fff}
  .copy-btn.copied{background:var(--success); color:#fff; border-color:var(--success)}

  .ai-links{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px}
  .ai-link{display:inline-flex; align-items:center; gap:8px; padding:10px 16px; background:var(--surface); border:1px solid var(--border); border-radius:10px; color:var(--text); text-decoration:none; font-size:14px; font-weight:500; transition:all .15s ease; min-height:44px}
  .ai-link:hover{border-color:var(--accent); background:var(--accent-soft)}
  .ai-link-dot{width:8px; height:8px; border-radius:50%}
  .ai-link-dot.deepseek{background:#4d6bfe}
  .ai-link-dot.alice{background:#fc3f1d}
  .ai-link-dot.qwen{background:#615ced}

  .divider{height:1px; background:var(--border); margin:24px 0}
  .sub-title{font-size:16px; font-weight:700; letter-spacing:-0.01em; margin:0 0 12px; color:var(--text)}

  .actions{position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,.9); backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px); border-top:1px solid var(--border); padding:12px 20px; z-index:10}
  .actions-inner{max-width:960px; margin:0 auto; display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}

  .finish{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:40px 32px; box-shadow:var(--shadow-md); text-align:center}
  .finish-icon{width:64px; height:64px; border-radius:50%; background:var(--success-soft); color:var(--success); display:flex; align-items:center; justify-content:center; margin:0 auto 20px}
  .finish-icon svg{width:32px; height:32px; stroke:currentColor; fill:none; stroke-width:2.5}
  .finish h2{font-size:28px; font-weight:700; letter-spacing:-0.02em; margin:0 0 8px}
  .finish p{color:var(--text-2); margin:0 0 24px}
  .stats{display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-bottom:28px}
  .stat{background:var(--surface-2); border-radius:var(--radius); padding:16px 12px}
  .stat-val{font-size:24px; font-weight:700; color:var(--accent); letter-spacing:-0.02em}
  .stat-lbl{font-size:12px; color:var(--text-3); margin-top:2px}
  .finish-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}

  .hidden{display:none !important}

  @media print{
    @page{size:A4; margin:15mm}
    body{background:#fff}
    .topbar, .actions, .copy-btn, .btn-ghost{display:none !important}
    main{padding:0; max-width:100%}
    .section, .hero, .finish{box-shadow:none; break-inside:avoid; page-break-inside:avoid}
    .field-input, textarea.field-input{border:1px solid #cbd5e1 !important; background:#fff !important}
    .code-block, .prompt-box{background:#f1f5f9 !important; color:#0f172a !important; border:1px solid #cbd5e1}
    .term.learned{border-color:#2563eb !important}
    .ethalon-content{max-height:none !important; opacity:1 !important; margin-top:16px !important}
    .quiz-opt.correct{background:#dcfce7 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
    .quiz-opt.wrong{background:#fee2e2 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  }

  @media (max-width:480px){
    .topbar-inner{padding:10px 14px; gap:10px}
    .brand-title{font-size:13px}
    .brand-sub{font-size:11px}
    .progress-wrap{min-width:110px}
    main{padding:16px 14px 110px}
    .section{padding:20px 18px}
    .hero{padding:28px 20px}
    .hero h1{font-size:24px}
    .section-title{font-size:17px}
    .stats{grid-template-columns:1fr}
    .actions{padding:10px 14px}
    .actions-inner{gap:8px}
    .actions-inner .btn{flex:1; padding:0 14px}
    .tags-table{font-size:13px}
    .tags-table th, .tags-table td{padding:8px}
    .code-block{font-size:11.5px}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   РАБОЧИЙ ЛИСТ · Занятие 7 · Анимации и UI-кит
   Учитель: Масликов М. М. · 10–11 класс
   ========================================================= */

const COURSE = {
  title: "Рабочий лист · Занятие 7",
  subtitle: "Анимации и UI-кит",
  teacher: "Масликов М. М.",
  grade: "10–11 класс",
  time: "80 минут"
};

const TERMS = [
  { key:"comp", name:"Компонент", def:"Самостоятельный кусочек интерфейса с именем, который переиспользуется: кнопка, карточка, поле, метка." },
  { key:"kit", name:"UI-кит", def:"Набор компонентов проекта, описанный один раз и применяемый везде." },
  { key:"base", name:"Базовый класс", def:"Правило компонента с тем, что общее для всех его экземпляров: .btn." },
  { key:"mod", name:"Модификатор", def:"Дополнительный класс, меняющий одну характеристику базового: .btn--primary." },
  { key:"state", name:"Состояние", def:"Вид элемента в зависимости от того, что с ним происходит. Задаётся псевдоклассом." },
  { key:"hover", name:":hover", def:"Состояние «курсор наведён». На телефоне не срабатывает." },
  { key:"focusv", name:":focus-visible", def:"Состояние «элемент получил фокус с клавиатуры». Подсветку убирать нельзя." },
  { key:"active", name:":active", def:"Состояние «нажат и удерживается»." },
  { key:"outline", name:"outline", def:"Обводка, рисуемая поверх элемента. Не занимает места и не сдвигает соседей, в отличие от border." },
  { key:"outoff", name:"outline-offset", def:"Отступ обводки от края элемента." },
  { key:"trans", name:"transition", def:"Плавный переход свойства из одного значения в другое. Пишется в базовом правиле, а не в состоянии." },
  { key:"transform", name:"transform", def:"Сдвиг, поворот, масштаб элемента. Не пересчитывает раскладку и не двигает соседей." },
  { key:"keyframes", name:"@keyframes", def:"Описание анимации по кадрам: что в начале, что в конце." },
  { key:"anim", name:"animation", def:"Назначение анимации элементу: имя, длительность, характер, режим заполнения." },
  { key:"animdel", name:"animation-delay", def:"Задержка перед стартом. Разные задержки у соседей дают эффект «лесенки»." },

function deepMerge(target, source){
  const out = Object.assign({}, target);
  for(const k in source){
    if(source[k] && typeof source[k] === "object" && !Array.isArray(source[k])){
      out[k] = deepMerge(target[k] || {}, source[k]);
    } else {
      out[k] = source[k];
    }
  }
  return out;
}

    if(!graphics.length) return false;
    return graphics.every(function(g){ return (g.getAttribute(name) || "") === value; });
  }
  checks.push({ label:"Есть fill=\"none\"", pass: attrEverywhere("fill", "none") });
  checks.push({ label:"Есть stroke=\"currentColor\"", pass: attrEverywhere("stroke", "currentColor") });
  checks.push({ label:"Есть stroke-width=\"2\"", pass: attrEverywhere("stroke-width", "2") });
  checks.push({ label:"Графических элементов (path, circle) от 1 до 3", pass: graphics.length >= 1 && graphics.length <= 3 });

  let cleanTags = true;
  const all = Array.prototype.slice.call(doc.querySelectorAll("*"));
  for(let i = 0; i < all.length; i++){
    const name = all[i].nodeName.toLowerCase();
    if(!SVG_ALLOWED_TAGS[name]) { cleanTags = false; break; }
    const attrs = Array.prototype.slice.call(all[i].attributes);
    for(let j = 0; j < attrs.length; j++){
      const an = attrs[j].name.toLowerCase();
      if(an === "id" || an.indexOf("on") === 0) { cleanTags = false; break; }
    }
    if(!cleanTags) break;
  }
  checks.push({ label:"Только svg, path и circle; без id, title, style и обработчиков", pass: cleanTags });

  return { checks: checks, root: root };
}

/* Безопасная сборка превью: только разрешённые теги и атрибуты, без innerHTML */
function sanitizeSvg(code){
  const doc = parseSvgDoc(code);
  if(!doc) return null;
  const src = doc.documentElement;
  if(!src || src.nodeName.toLowerCase() !== "svg") return null;

  function clone(node){
    const name = node.nodeName.toLowerCase();
    if(!SVG_ALLOWED_TAGS[name]) return null;
    const el = document.createElementNS(SVG_NS, name);
    const attrs = Array.prototype.slice.call(node.attributes);
    for(let i = 0; i < attrs.length; i++){
      const an = attrs[i].name.toLowerCase();
      if(!SVG_ALLOWED_ATTRS[an]) continue;
      if(an === "id") continue;
      const v = attrs[i].value;
      if(/javascript:|data:|url\(/i.test(v)) continue;
      el.setAttribute(an, v);
    }
    const kids = Array.prototype.slice.call(node.children);
    for(let k = 0; k < kids.length; k++){
      const c = clone(kids[k]);
      if(c) el.appendChild(c);
    }
    return el;
  }
  return clone(src);
}

  const progress = countProgress();

function previewBox(node, size, dark){
  const box = document.createElement("div");
  box.className = "icon-preview-box" + (dark ? " dark" : "");
  const clone = node.cloneNode(true);
  clone.setAttribute("width", String(size));
  clone.setAttribute("height", String(size));
  box.appendChild(clone);
  const cap = document.createElement("span");
  cap.textContent = dark ? "на тёмном, 24" : size + " px";
  box.appendChild(cap);
  return box;
}

function refreshIcon(idx, withProgress){
  const card = document.querySelector('[data-icon="' + idx + '"]');
  if(!card) return;
  const code = state.icons[idx].code;
  const analysis = analyzeSvg(code);

  const list = card.querySelector("[data-icon-checks]");
  list.innerHTML = analysis.checks.map(function(c){
    const cls = c.pass === null ? "pending" : (c.pass ? "ok" : "bad");
    const mark = c.pass === null ? "·" : (c.pass ? "✓" : "✕");
    return '<li class="' + cls + '"><span class="ic-mark" aria-hidden="true">' + mark + '</span><span>' + escapeHtml(c.label) + "</span></li>";
  }).join("");

  const prev = card.querySelector("[data-icon-preview]");
  while(prev.firstChild) prev.removeChild(prev.firstChild);
  const node = sanitizeSvg(code);
  if(!node){
    const empty = document.createElement("div");
    empty.className = "icon-preview-empty";
    empty.textContent = code.trim()
      ? "Превью появится, когда код станет похож на иконку: корень <svg> и только path или circle внутри."
      : "Здесь будет предпросмотр: иконка на 16, 24 и 48 px и на тёмном фоне — проверка масштаба и currentColor.";
    prev.appendChild(empty);
  } else {
    [16, 24, 48].forEach(function(size){ prev.appendChild(previewBox(node, size, false)); });
    prev.appendChild(previewBox(node, 24, true));
  }

  const status = card.querySelector("[data-icon-status]");
  const allPass = analysis.checks.every(function(c){ return c.pass === true; });
  const parsed = analysis.checks[0] && analysis.checks[0].pass === true;
  status.textContent = allPass ? "чисто" : (parsed ? "надо чистить" : (code.trim() ? "не разобралось" : "пусто"));
  status.className = "icon-status" + (allPass ? " good" : (parsed ? " mid" : ""));

  const ta = card.querySelector("textarea");
  if(ta) ta.classList.toggle("filled", !!code.trim());

  if(withProgress) updateProgress();
}

function updateProgress(){
  const p = countProgress();
  const fill = document.querySelector(".progress-fill");
  const num = document.querySelector(".progress-num");
  const bar = document.querySelector(".progress-bar");
  if(fill) fill.style.width = p.percent + "%";
  if(num) num.textContent = p.percent + "%";
  if(bar) bar.setAttribute("aria-valuenow", p.percent);

  const score = document.querySelector(".quiz-score");
  if(score) score.textContent = "Верно с первой попытки: " + quizScore() + " из " + QUIZ.length;

  const finishBtn = document.querySelector('[data-action="finish"]');
  if(finishBtn){
    if(p.percent >= 70){
      finishBtn.disabled = false;
      finishBtn.style.opacity = "";
      finishBtn.style.cursor = "";
    } else {
      finishBtn.disabled = true;
      finishBtn.style.opacity = ".5";
      finishBtn.style.cursor = "not-allowed";
    }
  }
}

/* ---------- Обработчики ---------- */
function bindHandlers(){
  app.querySelectorAll("[data-action]").forEach(function(btn){
    btn.addEventListener("click", handleAction);
  });

  app.querySelectorAll("[data-term]").forEach(function(el){
    const handler = function(){
      const key = el.dataset.term;
      state.termsLearned[key] = !state.termsLearned[key];
      saveState();
      render();
    };
    el.addEventListener("click", handler);
    el.addEventListener("keydown", function(e){
      if(e.key === " " || e.key === "Enter"){ e.preventDefault(); handler(); }
    });
  });

  app.querySelectorAll("[data-quiz-opt]").forEach(function(btn){
    btn.addEventListener("click", function(){
      const parts = btn.dataset.quizOpt.split(":");
      const qi = parseInt(parts[0], 10);
      const oi = parseInt(parts[1], 10);
      const st = state.quiz[qi];
      if(st.answered) return;
      st.answered = true;
      st.chosen = oi;
      st.correct = oi === QUIZ[qi].correct;
      saveState();
      paintQuiz(btn.closest(".quiz-card"), qi);
      updateProgress();
    });
  });

  app.querySelectorAll("[data-icon-code]").forEach(function(ta){
    ta.addEventListener("input", function(e){
      const idx = parseInt(e.target.dataset.iconCode, 10);
      state.icons[idx].code = e.target.value;
      saveState();
      refreshIcon(idx, true);
    });
  });

  const reflect = app.querySelector("[data-reflect]");
  if(reflect){
    reflect.addEventListener("input", function(e){
      state.reflect = e.target.value;
      e.target.classList.toggle("filled", !!e.target.value.trim());
      updateProgress();
      saveState();
    });
  }
}

function handleAction(e){
  const action = e.currentTarget.dataset.action;
  if(action === "start"){
    state.started = true;
    saveState();
    render();
    window.scrollTo({top:0, behavior:"smooth"});
  } else if(action === "reset"){
    if(confirm("Сбросить все заполненные поля? Это действие нельзя отменить.")){
      localStorage.removeItem(STORAGE_KEY);
      state = {
        started:false, finished:false, ethalonOpen:false,
        termsLearned:{},
        quiz: QUIZ.map(function(){ return { answered:false, chosen:-1, correct:false }; }),
        icons:[ {code:""}, {code:""}, {code:""} ],
        reflect:""
      };
      render();
      window.scrollTo({top:0, behavior:"smooth"});
    }
  } else if(action === "print"){
    window.print();
  } else if(action === "toggle-ethalon"){
    state.ethalonOpen = !state.ethalonOpen;
    saveState();
    render();
  } else if(action === "finish"){
    const p = countProgress();
    if(p.percent < 70){
      alert("Заполни ещё немного — сейчас заполнено " + p.percent + "%. Для завершения нужно 70%.");
      return;
    }
    state.finished = true;
    saveState();
    render();
    window.scrollTo({top:0, behavior:"smooth"});
  } else if(action === "back"){
    state.finished = false;
    saveState();
    render();
  } else if(action === "copy-prompt"){
    copyToClipboard(PROMPT_TEXT, e.currentTarget);
  }
}

async function copyToClipboard(text, btn){
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); }catch(_){}
    document.body.removeChild(ta);
  }
  const original = btn.textContent;
  btn.textContent = "✓ Скопировано";
  btn.classList.add("copied");
  setTimeout(function(){
    btn.textContent = original;
    btn.classList.remove("copied");
  }, 1600);
}

function escapeHtml(str){
  if(str == null) return "";
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function init(){
  loadState();
  render();
  // восстановить отмеченные ответы теста после рендера
  state.quiz.forEach(function(st, i){
    if(st.answered){
      const card = document.querySelector('[data-quiz="' + i + '"]');
      if(card) paintQuiz(card, i);
    }
  });
}
init();
</script>
