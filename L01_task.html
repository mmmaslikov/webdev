<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Рабочий лист · Занятие 1 · Веб-разработка</title>
<style>
  /* ---------- Переменные темы ---------- */
  :root{
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-2: #f4f4f5;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --text: #09090b;
    --text-2: #52525b;
    --text-3: #71717a;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --accent-hover: #1d4ed8;
    --success: #16a34a;
    --success-soft: #dcfce7;
    --warn: #f59e0b;
    --shadow-sm: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
    --shadow-md: 0 4px 6px -1px rgba(15,23,42,.06), 0 2px 4px -2px rgba(15,23,42,.06);
    --radius-sm: 10px;
    --radius: 14px;
    --radius-lg: 18px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button{font-family:inherit}
  input,textarea{font-family:inherit;font-size:inherit;color:inherit}

  /* ---------- Шапка ---------- */
  .topbar{
    position:sticky; top:0; z-index:10;
    background:rgba(255,255,255,.85);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:960px; margin:0 auto;
    padding:14px 20px;
    display:flex; align-items:center; gap:14px;
  }
  .brand{
    display:flex; flex-direction:column; min-width:0; flex:1;
  }
  .brand-title{
    font-size:14px; font-weight:600; letter-spacing:-0.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .brand-sub{
    font-size:12px; color:var(--text-3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .progress-wrap{
    display:flex; align-items:center; gap:10px; min-width:140px;
  }
  .progress-bar{
    flex:1; height:6px; background:var(--surface-2);
    border-radius:999px; overflow:hidden; min-width:80px;
  }
  .progress-fill{
    height:100%; width:0%;
    background:var(--accent);
    border-radius:999px;
    transition:width .4s cubic-bezier(.22,.61,.36,1);
  }
  .progress-num{
    font-size:13px; font-weight:600; color:var(--text-2);
    font-variant-numeric:tabular-nums;
    min-width:38px; text-align:right;
  }

  /* ---------- Контейнер ---------- */
  main{
    max-width:960px; margin:0 auto;
    padding:28px 20px 120px;
  }

  /* ---------- Экран «Старт» ---------- */
  .hero{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:40px 32px;
    box-shadow:var(--shadow-md);
    text-align:center;
  }
  .hero-badge{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 12px;
    background:var(--accent-soft);
    color:var(--accent);
    border-radius:999px;
    font-size:12px; font-weight:600;
    letter-spacing:.02em;
  }
  .hero h1{
    font-size:clamp(26px, 4vw, 36px);
    font-weight:700;
    letter-spacing:-0.02em;
    margin:18px 0 10px;
    line-height:1.15;
  }
  .hero p{
    color:var(--text-2);
    font-size:16px;
    max-width:560px;
    margin:0 auto 24px;
  }
  .hero-meta{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    margin-bottom:28px;
  }
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 12px;
    background:var(--surface-2);
    border-radius:999px;
    font-size:13px; color:var(--text-2);
  }
  .chip b{color:var(--text); font-weight:600}

  /* ---------- Кнопки ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    gap:8px;
    min-height:44px;
    padding:0 22px;
    border-radius:12px;
    border:1px solid transparent;
    font-size:15px; font-weight:600;
    cursor:pointer;
    transition:all .15s ease;
    user-select:none;
  }
  .btn:focus-visible{
    outline:3px solid var(--accent-soft);
    outline-offset:2px;
  }
  .btn-primary{
    background:var(--accent);
    color:#fff;
    box-shadow:0 1px 2px rgba(37,99,235,.3), 0 4px 12px rgba(37,99,235,.15);
  }
  .btn-primary:hover{background:var(--accent-hover)}
  .btn-primary:active{transform:translateY(1px)}
  .btn-secondary{
    background:var(--surface);
    color:var(--text);
    border-color:var(--border-strong);
  }
  .btn-secondary:hover{background:var(--surface-2)}
  .btn-ghost{
    background:transparent;
    color:var(--text-2);
  }
  .btn-ghost:hover{background:var(--surface-2); color:var(--text)}
  .btn-lg{min-height:52px; padding:0 28px; font-size:16px; border-radius:14px}

  /* ---------- Секции заданий ---------- */
  .task{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:28px;
    margin-bottom:20px;
    box-shadow:var(--shadow-sm);
  }
  .task-head{
    display:flex; align-items:flex-start; gap:14px;
    margin-bottom:18px;
  }
  .task-num{
    flex-shrink:0;
    width:36px; height:36px;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:15px;
  }
  .task-title-wrap{flex:1; min-width:0}
  .task-title{
    font-size:20px; font-weight:700; letter-spacing:-0.01em;
    margin:0 0 4px;
  }
  .task-goal{
    font-size:14px; color:var(--text-2); margin:0;
  }
  .task-status{
    flex-shrink:0;
    padding:4px 10px;
    border-radius:999px;
    font-size:12px; font-weight:600;
    background:var(--surface-2);
    color:var(--text-3);
  }
  .task-status.done{background:var(--success-soft); color:var(--success)}

  .instruction{
    background:var(--surface-2);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:20px;
    font-size:14px;
    color:var(--text-2);
  }
  .instruction ol{margin:0; padding-left:18px}
  .instruction li{margin-bottom:4px}
  .instruction li::marker{color:var(--accent); font-weight:600}

  /* ---------- Ментальная карта ---------- */
  .mindmap{
    background:linear-gradient(180deg, #fafbff 0%, #ffffff 100%);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    position:relative;
    overflow:hidden;
  }
  .mindmap-center{
    text-align:center;
    padding:14px 18px;
    background:var(--accent);
    color:#fff;
    border-radius:14px;
    font-weight:700;
    font-size:15px;
    letter-spacing:-0.01em;
    max-width:260px;
    margin:0 auto 24px;
    box-shadow:0 4px 14px rgba(37,99,235,.25);
  }
  .branches{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
  }
  @media (min-width:640px){
    .branches{grid-template-columns:1fr 1fr}
  }
  .branch{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .branch.has-content{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .branch-head{
    display:flex; align-items:center; gap:8px;
    font-weight:700; font-size:14px;
    margin-bottom:10px;
    color:var(--text);
  }
  .branch-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--accent);
  }
  .field{
    margin-bottom:8px;
  }
  .field:last-child{margin-bottom:0}
  .field-label{
    display:block;
    font-size:12px;
    color:var(--text-3);
    margin-bottom:4px;
    font-weight:500;
  }
  .field-input{
    width:100%;
    min-height:36px;
    padding:8px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--surface);
    font-size:14px;
    transition:border-color .15s ease, background .15s ease;
  }
  .field-input::placeholder{color:var(--text-3)}
  .field-input:hover{border-color:var(--border-strong)}
  .field-input:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .field-input.filled{
    background:#f8fbff;
    border-color:var(--accent);
  }
  textarea.field-input{
    min-height:80px;
    resize:vertical;
    line-height:1.5;
  }

  /* ---------- Карточка сайта ---------- */
  .site-form{
    display:grid; gap:14px;
  }
  .site-row{
    display:grid; gap:14px;
    grid-template-columns:1fr;
  }
  @media (min-width:640px){
    .site-row{grid-template-columns:1fr 1fr}
  }
  .radio-group{
    display:flex; gap:8px;
  }
  .radio{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    min-height:44px;
    padding:0 14px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--surface);
    cursor:pointer;
    font-size:14px; font-weight:500;
    color:var(--text-2);
    transition:all .15s ease;
    text-align:center;
  }
  .radio:hover{border-color:var(--border-strong)}
  .radio input{position:absolute; opacity:0; pointer-events:none}
  .radio.selected{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .radio:focus-within{
    outline:3px solid var(--accent-soft);
    outline-offset:2px;
  }

  /* ---------- Промпт ---------- */
  .prompt-box{
    background:#0f172a;
    color:#e2e8f0;
    border-radius:var(--radius);
    padding:18px;
    font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:13px;
    line-height:1.6;
    white-space:pre-wrap;
    margin-bottom:16px;
    position:relative;
  }
  .prompt-box::before{
    content:"ПРОМПТ";
    display:block;
    font-size:10px;
    letter-spacing:.1em;
    color:#64748b;
    margin-bottom:10px;
    font-weight:600;
  }
  .copy-btn{
    position:absolute; top:12px; right:12px;
    padding:6px 12px;
    background:rgba(255,255,255,.08);
    color:#cbd5e1;
    border:1px solid rgba(255,255,255,.1);
    border-radius:8px;
    font-size:12px; font-weight:500;
    cursor:pointer;
    min-height:32px;
    transition:all .15s ease;
  }
  .copy-btn:hover{background:rgba(255,255,255,.15); color:#fff}
  .copy-btn.copied{background:var(--success); color:#fff; border-color:var(--success)}

  .checklist{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:16px;
  }
  .checklist-title{
    font-size:13px; font-weight:600;
    color:var(--text-2);
    margin-bottom:12px;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .check-item{
    display:flex; align-items:flex-start; gap:12px;
    padding:10px 12px;
    border-radius:10px;
    cursor:pointer;
    transition:background .15s ease;
    user-select:none;
  }
  .check-item:hover{background:var(--surface-2)}
  .check-item.checked{background:var(--success-soft)}
  .check-box{
    flex-shrink:0;
    width:22px; height:22px;
    border:2px solid var(--border-strong);
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
    margin-top:1px;
  }
  .check-item.checked .check-box{
    background:var(--success);
    border-color:var(--success);
  }
  .check-box svg{
    width:14px; height:14px;
    stroke:#fff;
    stroke-width:3;
    fill:none;
    opacity:0;
    transition:opacity .15s ease;
  }
  .check-item.checked .check-box svg{opacity:1}
  .check-text{
    font-size:14px;
    color:var(--text);
    flex:1;
  }

  /* ---------- Футер с действиями ---------- */
  .actions{
    position:fixed;
    bottom:0; left:0; right:0;
    background:rgba(255,255,255,.9);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-top:1px solid var(--border);
    padding:12px 20px;
    z-index:10;
  }
  .actions-inner{
    max-width:960px; margin:0 auto;
    display:flex; gap:10px; justify-content:flex-end;
    flex-wrap:wrap;
  }

  /* ---------- Экран финала ---------- */
  .finish{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:40px 32px;
    box-shadow:var(--shadow-md);
    text-align:center;
  }
  .finish-icon{
    width:64px; height:64px;
    border-radius:50%;
    background:var(--success-soft);
    color:var(--success);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 20px;
  }
  .finish-icon svg{width:32px; height:32px; stroke:currentColor; fill:none; stroke-width:2.5}
  .finish h2{
    font-size:28px; font-weight:700; letter-spacing:-0.02em;
    margin:0 0 8px;
  }
  .finish p{color:var(--text-2); margin:0 0 24px}
  .stats{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:12px;
    margin-bottom:28px;
  }
  .stat{
    background:var(--surface-2);
    border-radius:var(--radius);
    padding:16px 12px;
  }
  .stat-val{
    font-size:24px; font-weight:700;
    color:var(--accent);
    letter-spacing:-0.02em;
  }
  .stat-lbl{
    font-size:12px; color:var(--text-3);
    margin-top:2px;
  }
  .finish-actions{
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
  }

  /* ---------- Скрытые состояния ---------- */
  .hidden{display:none !important}

  /* ---------- Печать ---------- */
  @media print{
    @page{size:A4; margin:15mm}
    body{background:#fff}
    .topbar, .actions, .copy-btn, .btn-ghost{display:none !important}
    main{padding:0; max-width:100%}
    .task, .hero, .finish{
      box-shadow:none;
      break-inside:avoid;
      page-break-inside:avoid;
      border:1px solid #d4d4d8;
    }
    .hero{padding:24px}
    .task{padding:18px}
    .field-input, textarea.field-input{
      border:1px solid #cbd5e1 !important;
      background:#fff !important;
    }
    .prompt-box{
      background:#f1f5f9 !important;
      color:#0f172a !important;
      border:1px solid #cbd5e1;
    }
    .mindmap-center{
      background:#2563eb !important;
      color:#fff !important;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }
    .btn-primary{
      background:#2563eb !important;
      color:#fff !important;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }
    .check-item.checked .check-box{
      background:#16a34a !important;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }
    .branch.has-content{
      border-color:#2563eb !important;
    }
  }

  /* ---------- Мобильная адаптация ---------- */
  @media (max-width:480px){
    .topbar-inner{padding:10px 14px; gap:10px}
    .brand-title{font-size:13px}
    .brand-sub{font-size:11px}
    .progress-wrap{min-width:110px}
    main{padding:16px 14px 110px}
    .task{padding:20px 18px}
    .hero{padding:28px 20px}
    .hero h1{font-size:24px}
    .task-title{font-size:17px}
    .stats{grid-template-columns:1fr}
    .actions{padding:10px 14px}
    .actions-inner{gap:8px}
    .actions-inner .btn{flex:1; padding:0 14px}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   РАБОЧИЙ ЛИСТ · Занятие 1 · Веб-разработка
   Архитектура интернета · 10–11 класс
   Учитель: Масликов Михаил Михайлович
   ========================================================= */

/* ---------- Константы ---------- */
const COURSE = {
  title: "Рабочий лист · Занятие 1",
  subtitle: "Введение в веб-разработку. Архитектура интернета",
  teacher: "Масликов М. М.",
  grade: "10–11 класс",
  time: "25 минут"
};

/* Структура ментальной карты: 5 ветвей с полями */
const MAP_BRANCHES = [
  { id:"client", label:"Клиент", icon:"🖥", fields:[
    { key:"who", label:"Кто это?", placeholder:"…" },
    { key:"does", label:"Что он делает?", placeholder:"…" }
  ]},
  { id:"server", label:"Сервер", icon:"🗄", fields:[
    { key:"who", label:"Кто это?", placeholder:"…" },
    { key:"does", label:"Что он делает?", placeholder:"…" }
  ]},
  { id:"protocols", label:"Протоколы", icon:"📡", fields:[
    { key:"http", label:"HTTP — это…", placeholder:"…" },
    { key:"dns", label:"DNS — это…", placeholder:"…" },
    { key:"code200", label:"Код 200 означает", placeholder:"…" },
    { key:"code404", label:"Код 404 означает", placeholder:"…" },
    { key:"code500", label:"Код 500 означает", placeholder:"…" }
  ]},
  { id:"tech", label:"Технологии", icon:"⚙️", fields:[
    { key:"html", label:"HTML — это (аналогия)", placeholder:"…" },
    { key:"css", label:"CSS — это (аналогия)", placeholder:"…" },
    { key:"js", label:"JS — это (аналогия)", placeholder:"…" }
  ]},
  { id:"sides", label:"Стороны профессии", icon:"👥", fields:[
    { key:"frontend", label:"Frontend — это…", placeholder:"…" },
    { key:"backend", label:"Backend — это…", placeholder:"…" }
  ]}
];

/* Чек-лист для задания 3 */
const CHECKLIST = [
  "Роли в аналогии различимы — понятно, кто просит, а кто отдаёт",
  "Внутри аналогии нет технических терминов (никаких «файлов», «запросов», «серверов»)",
  "Каждая аналогия укладывается в три предложения",
  "Есть отдельная строка про ограничение — где сравнение ломается",
  "Я бы понял эту аналогию, если бы услышал её от одноклассника",
  "В ответе нет фактической ошибки"
];

const PROMPT_TEXT = `Ты объясняешь устройство интернета подростку 14 лет, который никогда не писал код.

Задача: придумай три разные аналогии для пары «клиент и сервер». Аналогии должны быть из повседневной жизни школьника — не из мира техники.

Ограничения:
— никаких технических терминов внутри самой аналогии;
— каждая аналогия не длиннее трёх предложений;
— не используй сравнение с рестораном и с почтой — они уже разобраны на занятии.

Формат ответа: нумерованный список из трёх пунктов. В каждом пункте сначала аналогия, потом отдельной строкой — в чём она НЕ работает, где сравнение ломается.`;

const STORAGE_KEY = "wdc-l01-worksheet-v1";

/* ---------- Состояние ---------- */
let state = {
  started: false,
  finished: false,
  map: {},          // { branchId_fieldKey: value }
  site: {
    name: "",
    url: "",
    tag: "",
    titleText: "",
    requests: "",
    statusCode: "",
    hasError: null, // 'yes' | 'no' | null
    errorText: "",
    insight: ""
  },
  prompt: {
    response: "",
    checklist: [false,false,false,false,false,false],
    weak: "",
    fix: ""
  }
};

/* ---------- Хранилище ---------- */
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    if(parsed && typeof parsed === "object"){
      state = Object.assign(state, parsed);
    }
  }catch(e){}
}

/* ---------- Подсчёт прогресса ---------- */
function countProgress(){
  let filled = 0, total = 0;

  // Карта: все поля
  MAP_BRANCHES.forEach(b => {
    b.fields.forEach(f => {
      total++;
      const v = state.map[b.id + "_" + f.key];
      if(v && v.trim()) filled++;
    });
  });

  // Сайт: 8 обязательных полей
  const siteFields = ["name","url","tag","titleText","requests","statusCode","insight"];
  siteFields.forEach(k => {
    total++;
    if(state.site[k] && state.site[k].trim()) filled++;
  });
  total++; // hasError
  if(state.site.hasError !== null) filled++;

  // Промпт: ответ + 6 пунктов чек-листа + слабое место
  total++;
  if(state.prompt.response && state.prompt.response.trim()) filled++;
  CHECKLIST.forEach((_,i) => {
    total++;
    if(state.prompt.checklist[i]) filled++;
  });
  total++;
  if(state.prompt.weak && state.prompt.weak.trim()) filled++;

  return { filled, total, percent: total ? Math.round(filled/total*100) : 0 };
}

function branchFilled(branchId){
  const b = MAP_BRANCHES.find(x => x.id === branchId);
  return b.fields.every(f => {
    const v = state.map[b.id + "_" + f.key];
    return v && v.trim();
  });
}

/* ---------- Рендер ---------- */
const app = document.getElementById("app");

function render(){
  const progress = countProgress();

  let html = "";
  // Верхняя панель
  html += renderTopbar(progress);

  html += `<main>`;

  if(!state.started){
    html += renderHero();
  } else if(state.finished){
    html += renderFinish(progress);
  } else {
    html += renderTask1(progress);
    html += renderTask2(progress);
    html += renderTask3(progress);
  }

  html += `</main>`;

  if(state.started && !state.finished){
    html += renderActions(progress);
  }

  app.innerHTML = html;
  bindHandlers();
}

/* ---------- Обработчики ---------- */
function bindHandlers(){
  // Кнопки действий
  app.querySelectorAll("[data-action]").forEach(btn => {
    btn.addEventListener("click", handleAction);
  });

  // Поля карты
  app.querySelectorAll("[data-map-key]").forEach(input => {
    input.addEventListener("input", e => {
      state.map[e.target.dataset.mapKey] = e.target.value;
      updateFieldVisual(e.target);
      updateBranchVisual(e.target);
      updateProgress();
      saveState();
    });
  });

  // Поля сайта
  app.querySelectorAll("[data-site-key]").forEach(input => {
    input.addEventListener("input", e => {
      state.site[e.target.dataset.siteKey] = e.target.value;
      updateFieldVisual(e.target);
      updateProgress();
      saveState();
    });
  });

  // Радио сайта
  app.querySelectorAll("[data-site-radio]").forEach(radio => {
    radio.addEventListener("change", e => {
      state.site[e.target.dataset.siteRadio] = e.target.value;
      // Обновить визуал радио-группы
      const group = e.target.closest(".radio-group");
      group.querySelectorAll(".radio").forEach(r => r.classList.remove("selected"));
      e.target.closest(".radio").classList.add("selected");
      updateProgress();
      saveState();
    });
  });

  // Поля промпта
  app.querySelectorAll("[data-prompt-key]").forEach(input => {
    input.addEventListener("input", e => {
      state.prompt[e.target.dataset.promptKey] = e.target.value;
      updateFieldVisual(e.target);
      updateProgress();
      saveState();
    });
  });

  // Чек-лист
  app.querySelectorAll("[data-check-idx]").forEach(item => {
    const handler = () => {
      const idx = parseInt(item.dataset.checkIdx, 10);
      state.prompt.checklist[idx] = !state.prompt.checklist[idx];
      item.classList.toggle("checked", state.prompt.checklist[idx]);
      item.setAttribute("aria-checked", String(state.prompt.checklist[idx]));
      updateProgress();
      saveState();
    };
    item.addEventListener("click", handler);
    item.addEventListener("keydown", e => {
      if(e.key === " " || e.key === "Enter"){ e.preventDefault(); handler(); }
    });
  });
}

function handleAction(e){
  const action = e.currentTarget.dataset.action;
  if(action === "start"){
    state.started = true;
    saveState();
    render();
    window.scrollTo({top:0, behavior:"smooth"});
  } else if(action === "reset"){
    if(confirm("Сбросить все заполненные поля? Это действие нельзя отменить.")){
      localStorage.removeItem(STORAGE_KEY);
      state = {
        started:false, finished:false,
        map:{},
        site:{name:"",url:"",tag:"",titleText:"",requests:"",statusCode:"",hasError:null,errorText:"",insight:""},
        prompt:{response:"",checklist:[false,false,false,false,false,false],weak:"",fix:""}
      };
      render();
      window.scrollTo({top:0, behavior:"smooth"});
    }
  } else if(action === "print"){
    window.print();
  } else if(action === "finish"){
    const p = countProgress();
    if(p.percent < 80){
      alert(`Заполни ещё хотя бы немного — сейчас заполнено ${p.percent}%. Для завершения нужно 80%.`);
      return;
    }
    state.finished = true;
    saveState();
    render();
    window.scrollTo({top:0, behavior:"smooth"});
  } else if(action === "back"){
    state.finished = false;
    saveState();
    render();
  } else if(action === "copy-prompt"){
    copyToClipboard(PROMPT_TEXT, e.currentTarget);
  }
}

/* ---------- Вспомогательные ---------- */
function updateFieldVisual(el){
  el.classList.toggle("filled", !!el.value.trim());
}
function updateBranchVisual(input){
  const key = input.dataset.mapKey;
  const branchId = key.split("_")[0];
  const branchEl = input.closest(".branch");
  if(branchEl) branchEl.classList.toggle("has-content", branchFilled(branchId));
}
function updateProgress(){
  const p = countProgress();
  const fill = document.querySelector(".progress-fill");
  const num = document.querySelector(".progress-num");
  const bar = document.querySelector(".progress-bar");
  if(fill) fill.style.width = p.percent + "%";
  if(num) num.textContent = p.percent + "%";
  if(bar) bar.setAttribute("aria-valuenow", p.percent);

  // Активация кнопки «Завершить»
  const finishBtn = document.querySelector('[data-action="finish"]');
  if(finishBtn){
    if(p.percent >= 80){
      finishBtn.disabled = false;
      finishBtn.style.opacity = "";
      finishBtn.style.cursor = "";
    } else {
      finishBtn.disabled = true;
      finishBtn.style.opacity = ".5";
      finishBtn.style.cursor = "not-allowed";
    }
  }
}

async function copyToClipboard(text, btn){
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    // Фоллбэк
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); }catch(_){}
    document.body.removeChild(ta);
  }
  const original = btn.textContent;
  btn.textContent = "✓ Скопировано";
  btn.classList.add("copied");
  setTimeout(() => {
    btn.textContent = original;
    btn.classList.remove("copied");
  }, 1600);
}

function escapeHtml(str){
  if(str == null) return "";
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

/* ---------- Инициализация ---------- */
function init(){
  loadState();
  render();
}
